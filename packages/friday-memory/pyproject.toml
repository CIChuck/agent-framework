[project]
name = "friday-framework-memory"
version = "0.1.0a2"
description = "Intelligence layer: Storage, Retrieval, and Context Engineering"
readme = "README.md"
requires-python = ">=3.13.4"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "friday-framework-core==0.1.0a2",
    "friday-framework-llm==0.1.0a2",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "tiktoken>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-memory"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_memory"]

[tool.uv.sources]
friday-framework-core = { workspace = true }
friday-framework-llm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests_memory"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
