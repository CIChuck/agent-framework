[project]
name = "friday-framework-tools"
version = "0.1.0a2"
description = "Comprehensive tool library for AI agents"
readme = "README.md"
requires-python = ">=3.13.4"
license = "MIT"
authors = [{ name = "Friday Team" }]
keywords = ["ai", "agents", "tools", "llm", "automation"]

dependencies = [
    # Core protocols
    "friday-framework-core==0.1.0a2",
    # HTTP & Web
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "lxml>=4.9.0",
    # Data formats
    "pyyaml>=6.0.0",
    "jsonpath-ng>=1.5.0",
    # Text & Templates
    "jinja2>=3.1.0",
    # Git
    "gitpython>=3.1.0",
    # Math & Dates
    "python-dateutil>=2.8.0",
    "psutil>=7.2.1",
    # Encoding detection
    "charset-normalizer>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-tools"

[project.optional-dependencies]
sandbox = [
    "friday-framework-sandbox==0.1.0a2",
]
finance = [
    "friday-framework-finance==0.1.0a2",
]
moltbook = [
    "friday-framework-moltbook==0.1.0a2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "pytest-mock>=3.10.0",
]
llm = ["friday-framework-llm==0.1.0a2"]

# Framework adapters (optional - import only when used)
langchain = ["langchain-core>=0.1.0"]
anthropic = ["anthropic>=0.25.0"]
openai = ["openai>=1.0.0"]
all-adapters = [
    "friday-framework-tools[langchain]==0.1.0a2",
    "friday-framework-tools[anthropic]==0.1.0a2",
    "friday-framework-tools[openai]==0.1.0a2",
]

# Document format readers (optional)
documents = [
    "pypdf>=4.0",
    "python-docx>=1.0",
]

# Spreadsheet readers (optional)
spreadsheets = [
    "openpyxl>=3.1",
]

# All file format support
all-formats = [
    "friday-framework-tools[documents]==0.1.0a2",
    "friday-framework-tools[spreadsheets]==0.1.0a2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_tools"]

[tool.uv.sources]
friday-framework-core = { workspace = true }
friday-framework-sandbox = { workspace = true }
friday-framework-moltbook = { workspace = true }
friday-framework-finance = { workspace = true }
friday-framework-llm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests_tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
