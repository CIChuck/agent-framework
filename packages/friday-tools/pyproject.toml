[project]
name = "friday-tools"
version = "0.1.0"
description = "Comprehensive tool library for AI agents"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Friday Team" }]
keywords = ["ai", "agents", "tools", "llm", "automation"]

dependencies = [
    # Core protocols
    "friday-core",
    # Sandbox for code execution
    "friday-sandbox",
    # HTTP & Web
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "lxml>=4.9.0",
    # Data formats
    "pyyaml>=6.0.0",
    "jsonpath-ng>=1.5.0",
    # Text & Templates
    "jinja2>=3.1.0",
    # Git
    "gitpython>=3.1.0",
    # Math & Dates
    "python-dateutil>=2.8.0",
    "psutil>=7.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "pytest-mock>=3.10.0",
]

# Framework adapters (optional - import only when used)
langchain = ["langchain-core>=0.1.0"]
anthropic = ["anthropic>=0.25.0"]
openai = ["openai>=1.0.0"]
all-adapters = [
    "friday-tools[langchain]",
    "friday-tools[anthropic]",
    "friday-tools[openai]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_tools"]

[tool.uv.sources]
friday-core = { workspace = true }
friday-sandbox = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
