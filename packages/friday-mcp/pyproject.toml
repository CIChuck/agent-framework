[project]
name = "friday-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) integration for Friday Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Friday Team" }]
keywords = ["ai", "agents", "mcp", "model-context-protocol", "llm"]

dependencies = [
    # Core protocols
    "friday-core",

    # HTTP client for SSE transport
    "httpx>=0.25.0",

    # Configuration models
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
]

# SSE server support (FastAPI-based)
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

# Full integration with Friday packages
full = [
    "friday-mcp[server]",
    "friday-tools",
    "friday-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
friday-core = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
