[project]
name = "friday-framework-agent"
version = "0.1.0a2"
description = "Agent orchestration layer for Friday Framework"
readme = "README.md"
requires-python = ">=3.13.4"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "friday-framework-core==0.1.0a2",
    "friday-framework-memory==0.1.0a2",
    "friday-framework-llm==0.1.0a2",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-agent"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_agent"]

[tool.pytest.ini_options]
testpaths = ["tests_agent"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
friday-framework-core = { workspace = true }
friday-framework-memory = { workspace = true }
friday-framework-llm = { workspace = true }
