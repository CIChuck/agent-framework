[project]
name = "friday-framework-commands"
version = "0.1.0a4"
description = "Frontend-neutral command contracts and injected-handler registry"
readme = "README.md"
requires-python = ">=3.13.4"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://gendevx.com/friday/"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-commands"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_commands"]
