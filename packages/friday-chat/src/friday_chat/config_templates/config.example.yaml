  context:
    max_tools: 20
    max_budget_ratio: 0.25
    recommendation_threshold: 0.5
    include_in_context: true
    include_hints: true
web:
  client:
    timeout: 30.0
    max_retries: 3
    follow_redirects: true
    max_response_size: 20000000
    user_agent: Mozilla/5.0 (compatible; FridayBot/1.0)
  ssl:
    verify: true
    ca_bundle: null
  proxy:
    http: null
    https: null
    no_proxy:
    - localhost
    - 127.0.0.1
  security:
    allow_private_ips: false
    blocked_hosts: []
  reader:
    default_format: auto
    max_content_length: 500000
    include_metadata: false
    remove_elements:
    - script
    - style
    - nav
    - footer
    - header
    - aside
    - iframe
    - noscript
  serper_api_key: ${FRIDAY_SERPER_API_KEY}
langfuse:
  enabled: true
  public_key: ${FRIDAY_LANGFUSE_PUBLIC_KEY}
  secret_key: ${FRIDAY_LANGFUSE_SECRET_KEY}
  host: https://us.cloud.langfuse.com
finance:
  massive:
    api_key: ${FRIDAY_MASSIVE_API_KEY}
    tier: free
security:
  sanitization:
    enabled: true
    detection:
      enabled: true
      sensitivity: medium
      max_scan_length: 100000
      custom_patterns: []
      allowlist_patterns: []
    normalization:
      enabled: true
      max_normalize_length: 200000
      strip_zero_width: true
      decode_html_entities: true
      strip_html_comments: true
      collapse_whitespace: true
    wrapping:
      enabled: true
      marker_style: xml
      include_metadata: true
    quarantine:
      action: warn
      redaction_text: '[CONTENT REDACTED: Potential injection detected]'
      log_detections: true
    storage_policy:
      store_sanitized: true
      store_raw_on_detection: true
      raw_store_mode: quarantine
      quarantine_path: .friday/quarantine/tool_outputs.jsonl
    category_risks:
      web: critical
      shell: critical
      filesystem: high
      git: medium
      code: medium
      data: medium
      text: low
      utility: minimal
    tool_overrides:
      web_reader: critical
      command_execute: critical
session:
  flush_on_exit: true
  lifecycle_on_exit: true
  reorganize_on_exit: true
  reorganize_mode: fast
speech:
  enabled: false
  tts:
    provider: picovoice
  wakeword:
    enabled: false
    provider: picovoice
  elevenlabs:
    api_key: ${FRIDAY_ELEVENLABS_API_KEY}
    voice_id: pFZP5JQG7iQjIQuC4Bku
    model_id: eleven_multilingual_v2
    output_format: mp3_44100_128
  picovoice:
    access_key: ${FRIDAY_PICOVOICE_ACCESS_KEY}
    orca:
      model_path: .friday/speech/orca_params_en_female.pv
    porcupine:
      enabled: false
      keywords:
      - friday
      sensitivities:
      - 0.6
  mode: live
  streaming: true
  playback:
    enabled: true
    blocking: false
  selection:
    strategy: all
    max_words: 40
    tags:
      include_open: <speech>
      include_close: </speech>
      exclude_open: <nospeech>
      exclude_close: </nospeech>
  chunking:
    enabled: true
    max_chars: 1800
    boundary: sentence
