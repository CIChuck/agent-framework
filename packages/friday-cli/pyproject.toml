[project]
name = "friday-cli"
version = "0.1.0"
description = "The Friday Assistant Runtime"
requires-python = ">=3.10"
dependencies = [
    "friday-core",
    "friday-runtime",
    "friday-memory",
    "friday-llm",
    "friday-agent",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",  # For FastAPI testing
]

[project.scripts]
friday = "friday_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_cli"]

[tool.uv.sources]
friday-core = { workspace = true }
friday-runtime = { workspace = true }
friday-memory = { workspace = true }
friday-llm = { workspace = true }
friday-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests_cli"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
