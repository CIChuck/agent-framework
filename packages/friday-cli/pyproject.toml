[project]
name = "friday-framework-cli"
version = "0.1.0a1"
description = "The Friday Assistant Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "friday-framework-core==0.1.0a1",
    "friday-framework-runtime==0.1.0a1",
    "friday-framework-memory==0.1.0a1",
    "friday-framework-llm==0.1.0a1",
    "friday-framework-agent==0.1.0a1",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",  # For FastAPI testing
]

[project.scripts]
friday = "friday_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_cli"]

[tool.uv.sources]
friday-framework-core = { workspace = true }
friday-framework-runtime = { workspace = true }
friday-framework-memory = { workspace = true }
friday-framework-llm = { workspace = true }
friday-framework-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests_cli"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
