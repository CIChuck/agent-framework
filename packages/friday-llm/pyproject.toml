[project]
name = "friday-framework-llm"
version = "0.1.0a0"
description = "LLM inference layer for Friday Framework"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "friday-framework-core==0.1.0a0",
    "friday-framework-telemetry==0.1.0a0",
    "litellm>=1.81.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=2.59,<3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_llm"]

[tool.pytest.ini_options]
testpaths = ["tests_llm"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
friday-framework-core = { workspace = true }
friday-framework-telemetry = { workspace = true }
