[project]
name = "friday-core"
version = "0.1.0"
description = "Foundation interfaces and utilities for Friday"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
