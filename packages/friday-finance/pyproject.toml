[project]
name = "friday-framework-finance"
version = "0.1.0a1"
description = "Financial data provider integration for Friday Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "massive",
    "friday-framework-core==0.1.0a1",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-finance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_finance"]

[project.scripts]
friday-finance-demo = "friday_finance.demo:main"

[tool.uv.sources]
friday-framework-core = { workspace = true }
