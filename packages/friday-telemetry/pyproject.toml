[project]
name = "friday-framework-telemetry"
version = "0.1.0a1"
description = "Unified telemetry for Friday framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-telemetry"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests_telemetry"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
