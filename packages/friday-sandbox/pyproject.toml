[project]
name = "friday-framework-sandbox"
version = "0.1.0a3"
description = "Docker-based code execution sandbox for AI agents"
readme = "README.md"
requires-python = ">=3.13.4"
license = "MIT"
authors = [{ name = "Friday Team" }]
keywords = ["ai", "agents", "sandbox", "docker", "code-execution"]

dependencies = [
    "docker>=7.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework/tree/main/packages/friday-sandbox"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests_sandbox"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
