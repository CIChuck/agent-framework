[project]
name = "friday-framework-transcript"
version = "0.1.0a0"
description = "Persistent, immutable conversation transcript storage for Friday"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Friday Team" }]
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_transcript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
