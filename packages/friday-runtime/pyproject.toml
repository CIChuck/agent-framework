[project]
name = "friday-runtime"
version = "0.1.0"
description = "Headless runtime kernel for the Friday Agent Framework"
requires-python = ">=3.10"
dependencies = [
    "friday-core",
    "friday-memory",
    "friday-llm",
    "friday-telemetry",
    "friday-agent",
    "friday-transcript",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests_runtime"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
friday-core = { workspace = true }
friday-memory = { workspace = true }
friday-llm = { workspace = true }
friday-telemetry = { workspace = true }
friday-agent = { workspace = true }
friday-transcript = { workspace = true }
