[project]
name = "friday"
version = "0.1.0"
description = "Friday Agentic Framework Workspace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Friday Team" }]
keywords = ["ai", "agents", "memory", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "friday-core",
    "friday-memory",
    "friday-llm",
    "friday-agent",
    "friday-sandbox",
    "friday-tools",
    "friday-mcp",
    "friday-transcript",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv.sources]
friday-core = { workspace = true }
friday-memory = { workspace = true }
friday-llm = { workspace = true }
friday-agent = { workspace = true }
friday-sandbox = { workspace = true }
friday-tools = { workspace = true }
friday-mcp = { workspace = true }
friday-transcript = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/*", "tests/lab"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
