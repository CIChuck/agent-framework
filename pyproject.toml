[project]
name = "friday-framework"
version = "0.1.0a1"
description = "Friday Agentic Framework Workspace"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Friday Team" }]
keywords = ["ai", "agents", "memory", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "friday-framework-core==0.1.0a1",
    "friday-framework-memory==0.1.0a1",
    "friday-framework-llm==0.1.0a1",
    "friday-framework-agent==0.1.0a1",
    "friday-framework-tools==0.1.0a1",
    "friday-framework-transcript==0.1.0a1",
    "friday-framework-cli==0.1.0a1",
    "friday-framework-runtime==0.1.0a1",
    "friday-framework-telemetry==0.1.0a1",
    "friday-chat==0.1.0a1",
]

[project.optional-dependencies]
speech = [
    "friday-framework-speech[picovoice,elevenlabs]==0.1.0a1",
    "friday-chat[speech]==0.1.0a1",
]
finance = [
    "friday-framework-finance==0.1.0a1",
    "friday-framework-tools[finance]==0.1.0a1",
    "friday-chat[finance]==0.1.0a1",
]
sandbox = [
    "friday-framework-sandbox==0.1.0a1",
    "friday-framework-tools[sandbox]==0.1.0a1",
    "friday-chat[sandbox]==0.1.0a1",
]
moltbook = [
    "friday-framework-moltbook==0.1.0a1",
    "friday-framework-tools[moltbook]==0.1.0a1",
    "friday-chat[moltbook]==0.1.0a1",
]
mcp = [
    "friday-framework-mcp==0.1.0a1",
]
documents = [
    "friday-framework-tools[documents]==0.1.0a1",
]
spreadsheets = [
    "friday-framework-tools[spreadsheets]==0.1.0a1",
]
langfuse = [
    "friday-framework-llm[langfuse]==0.1.0a1",
]
all = [
    "friday-framework-speech[picovoice,elevenlabs]==0.1.0a1",
    "friday-framework-finance==0.1.0a1",
    "friday-framework-sandbox==0.1.0a1",
    "friday-framework-moltbook==0.1.0a1",
    "friday-framework-mcp==0.1.0a1",
    "friday-framework-tools[all-adapters,all-formats,finance,moltbook,sandbox]==0.1.0a1",
    "friday-framework-llm[langfuse]==0.1.0a1",
    "friday-chat[finance,moltbook,sandbox,speech]==0.1.0a1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/CIChuck/agent-framework"
Repository = "https://github.com/CIChuck/agent-framework"
Issues = "https://github.com/CIChuck/agent-framework/issues"
Documentation = "https://github.com/CIChuck/agent-framework/tree/main/docs"
Source = "https://github.com/CIChuck/agent-framework"

[tool.uv.sources]
friday-framework-core = { workspace = true }
friday-framework-memory = { workspace = true }
friday-framework-llm = { workspace = true }
friday-framework-agent = { workspace = true }
friday-framework-speech = { workspace = true }
friday-framework-sandbox = { workspace = true }
friday-framework-tools = { workspace = true }
friday-framework-moltbook = { workspace = true }
friday-framework-mcp = { workspace = true }
friday-framework-transcript = { workspace = true }
friday-framework-cli = { workspace = true }
friday-chat = { workspace = true }
friday-framework-runtime = { workspace = true }
friday-framework-telemetry = { workspace = true }
friday-framework-finance = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = '(^|/|\\\\)(conftest\\.py|examples($|/|\\\\).*)'
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages/*/tests_*", "experiments/*/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.20.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
