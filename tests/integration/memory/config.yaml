# Friday-Memory Integration Test Configuration
#
# This config file controls LLM, embedding, and memory settings
# for the friday.py interactive CLI.

# Logging Settings
logging:
  # Global log level: DEBUG, INFO, WARNING, ERROR
  level: WARNING

  # Enable verbose extraction logging (shows full LLM extraction responses)
  # Set to true for debugging extraction issues
  extraction_debug: false

  # Enable ontology rejection logging (logs every entity/relationship rejected
  # by the ExtractionFilter). Useful for measuring noise and tuning the ontology.
  # When enabled without a file path, rejections print to the console.
  # When a file path is set, rejections are written to that file instead.
  extraction_rejections: true
  extraction_rejections_file: ./extraction_rejections.log

  # Enable verbose tool loading/execution logging
  # Set to true for debugging tool issues
  tools_debug: true

# LLM Provider Settings (for chat completions)

llm:
