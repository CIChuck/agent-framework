# Extraction LLM Settings (for entity/relationship extraction)
# Can use a smaller, faster model optimized for structured output
extraction:
  # Model name - smaller/cheaper models work well for extraction
  #
  # Local: "ollama/llama3.2:3b", "ollama/qwen2.5:3b", "openai/local-model"
  # OpenAI: "gpt-4o-mini" (cheap and fast)
  # OpenRouter: "openrouter/anthropic/claude-3-haiku" (fast, cheap)
  #             "openrouter/openai/gpt-4o-mini"
  #             "openrouter/meta-llama/llama-3.1-8b-instruct"
  #
  # Set to null or remove to use the main LLM for extraction
  
  #local
  #model: "openai/local-model"

  #model: "openrouter/google/gemma-3-27b-it"
  #model: "openrouter/anthropic/claude-3-haiku"

  model: "openrouter/google/gemini-2.5-flash"

  # API base URL (same as main LLM if using same provider)
  # OpenRouter: https://openrouter.ai/api/v1
  
  #local - Colossus
  #api_base: "http://192.168.0.83:1234/v1"
  api_base: "https://openrouter.ai/api/v1"

  # localAPI key
  #api_key: "lm-studio"

  # open router key
  api_key: "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"
  #api_key: "sk-or-v1-your-openrouter-key-here"

  # Temperature (0.0 for deterministic extraction)
  temperature: 0.0

  # Maximum tokens for extraction response (limits output length)
  # Extraction outputs are structured JSON - needs enough room for many entities
  # after processing large documents (800 was too small, caused truncated JSON)
  max_tokens: 4000 

  # Timeout in seconds (can be higher since it runs in background)
  timeout_seconds: 90.0

  # Extraction interval: how often to run background extraction
  # 0 = every turn (default behavior)
  # N = every N turns (e.g., 5 means extract on turns 5, 10, 15, ...)
  # -1 = session exit only (minimal extraction)
  interval: 3

  # Rejection log: file path for logging entities/edges rejected by the
  # ExtractionFilter (ontology validation). Written regardless of global
  # log level. Useful for tuning the ontology configuration.
  # Set to null or remove to disable rejection logging.
  rejection_log: "./vector/extraction_rejections.log"

  # Ontology configuration — controls which entity types and edge relations
  # are allowed in the knowledge graph. Serves double duty:
  # 1. Injected into the extraction prompt to constrain LLM output
  # 2. Used by ExtractionFilter for post-processing validation
  ontology:
    node_types:
      person:
        description: "A human individual"
        examples: ["Chuck", "Elon Musk", "Dr. Smith"]
      organization:
        description: "A company, institution, or group"
        examples: ["Google", "MIT", "United Nations"]
      technology:
        description: "A software tool, language, framework, or hardware"
        examples: ["Python", "React", "ChromaDB", "GPU"]
      location:
        description: "A physical or virtual place"
        examples: ["San Francisco", "GitHub", "AWS us-east-1"]
      product:
        description: "A named product, service, or system"
        examples: ["Friday", "ChatGPT", "iPhone"]
      document:
        description: "A named document, spec, or reference"
        examples: ["README", "RFC 7231", "build plan"]
      event:
        description: "a time-bound occurrence at a specific location that brings together people for a particular purpose or shared experience."
        examples: ["sporting event", "gathering", "party", "meeting", "funeral", "wedding"]
    edge_relations:
      ownership:
        - OWNS
        - CREATED
        - AUTHORED
        - FOUNDED
      association:
        - WORKS_AT
        - MEMBER_OF
        - AFFILIATED_WITH
        - PART_OF
        - CONTAINS
      usage:
        - USES
        - SHOULD_USE
        - DEPENDS_ON
        - BUILT_WITH
        - INTEGRATES
        - UTILIZES
      action:
        - MANAGES
        - MAINTAINS
        - CONTRIBUTES_TO
        - DEVELOPS
        - SUPPORTS
      knowledge:
        - KNOWS
        - EXPERT_IN
        - STUDIES
        - TEACHES
      relationship:
        - RELATES_TO
        - SIMILAR_TO
        - DERIVES_FROM
        - REPLACES
        - SPOUSE_OF
        - SIBLING_OF
        - PARENT_OF
        - IS_A
        - REPORTS_TO
      spatial:
        - LOCATED_IN
        - DEPLOYED_ON
        - HOSTED_BY
        - HELD_AT
      preference:
        - PREFERS
        - DISLIKES
        - RECOMMENDS
      participation:
        - WILL_ATTEND
        - AVOIDS

    label_blocklist:
      - "morning"
      - "afternoon"
      - "evening"
      - "today"
      - "yesterday"
      - "data"
      - "thing"
      - "stuff"
      - "something"

    max_label_length: 60
    min_label_length: 2

  # Extraction prompt template
  # Available placeholders: {turn_id}, {timestamp}, {user_name}, {assistant_name},
  #   {user_message}, {assistant_response}, {ontology_constraints}
  #
  # Storage strategy:
  # - entities, relationships → Graph Store (structured, Hebbian learning via hit_count)
  # - insights → Vector Store (rich semantic content for similarity search)

  prompt: |
    Analyze the conversation turn below to extract a knowledge graph and semantic memories.

    Turn ID: {turn_id}
    Timestamp: {timestamp}

    Conversation Context:
    - Speaker A (Human): {user_name}
    - Speaker B (AI): {assistant_name}

    TEXT TO ANALYZE:
    {user_name}: {user_message}
    {assistant_name}: {assistant_response}

    {ontology_constraints}

    INSTRUCTIONS:

    1. **Entity Extraction (Nodes)**
      - Extract ONLY concrete, named entities: specific people, organizations, technologies, locations, products, or documents.
      - Do NOT extract abstract concepts, feelings, time references, adjectives, or generic terms.
      - Do NOT extract "{user_name}" or "{assistant_name}" unless they are referred to by a proper name in the conversation.
      - Each entity must have a `type` from the ALLOWED TYPES listed above.
      - **Canonicalization**: Create an `id` in snake_case (e.g., "Python 3.1" → "python_3").
      - **Resolution**: Resolve pronouns (he, she, it) to the specific noun if clear from context.
      - **Be selective**: Only extract entities that carry meaningful, reusable knowledge. Skip throwaway mentions.

    2. **Relationship Extraction (Edges)**
      - Extract directional relationships: SOURCE → RELATION → TARGET.
      - The `relation` field MUST be one of the ALLOWED RELATIONS listed above. Do not invent new relation types.
      - Source and target must reference entity `id` values from your entity list.
      - Prefer the most specific applicable relation (e.g., AUTHORED over RELATES_TO).
      - Do NOT create relationships for trivial or obvious connections.

    3. **Insight Extraction (Structured Facts)**
      - Extract 1-3 rich, contextual observations worth remembering long-term.
      - **text**: A complete 1-2 sentence observation. Write as if explaining to someone with no prior context.
      - **topic**: One of "preference", "biographical", "technical", or "constraint".
      - **entities**: Entity names mentioned in this insight.
      - **confidence**: 0.0-1.0 based on how explicitly the information was stated.
      - **sentiment**: "positive", "negative", or "neutral".
      - Do NOT extract trivial observations. Each insight should be independently useful for future recall.

    4. **Turn Summary**
      - Write a 2-4 sentence paragraph summarizing the conversation turn.
      - Include who was talking, the main topic, and any decisions or conclusions.

    JSON OUTPUT FORMAT:

    Respond ONLY with valid JSON:

    {{
        "entities": [
            {{"id": "entity_id", "label": "Display Name", "type": "ALLOWED_TYPE", "properties": {{}}}}
        ],
        "relationships": [
            {{"source_id": "actor_id", "relation": "ALLOWED_RELATION", "target_id": "recipient_id"}}
        ],
        "insights": [
            {{
                "text": "Rich, contextual sentence worth remembering.",
                "topic": "preference|biographical|technical|constraint",
                "entities": ["entity1"],
                "confidence": 0.9,
                "sentiment": "positive|negative|neutral"
            }}
        ],
        "summary": "A 2-4 sentence summary of this conversation turn."
    }}

    If nothing meaningful is found, return empty arrays and empty string for summary. Quality over quantity — fewer accurate extractions are better than many noisy ones.


  #  Old prompts
  # prompt: |
  #   Analyze the following conversation turn and extract structured information.

  #   Turn ID: {turn_id}
  #   Timestamp: {timestamp}

  #   Conversation participants:
  #   - Human user: {user_name}
  #   - AI assistant: {assistant_name}

  #   {user_name} said:
  #   {user_message}

  #   {assistant_name} replied:
  #   {assistant_response}

  #   Extract the following:

  #   1. **Entities**: Named people, organizations, projects, technologies, or concepts mentioned.
  #      - Use "{user_name}" for the human, "{assistant_name}" for the AI
  #      - Include type: person, project, technology, organization, concept

  #   2. **Relationships**: Directional connections between entities.
  #      - SOURCE performs action on TARGET (active voice)
  #      - Example: source="{user_name}", relation="creates", target="{assistant_name}"
  #      - Do NOT create reverse/duplicate relationships

  #   3. **Insights**: Rich, contextual observations worth remembering (1-2 sentences each).
  #      - Write as complete, meaningful sentences
  #      - Include context that would be useful for future semantic search
  #      - Examples:
  #        - "{user_name} is building an AI assistant named {assistant_name} with persistent memory capabilities."
  #        - "{assistant_name} expressed enthusiasm about helping with coding tasks."
  #        - "{user_name} prefers Python for backend development and finds TypeScript verbose."
  #      - NOT micro-facts like "Chuck creates Friday" (those go in relationships)

  #   4. **Tasks**: Mentioned tasks or goals with their status.

  #   Respond ONLY with valid JSON:
  #   {{
  #       "entities": [
  #           {{"label": "name", "type": "person|project|technology|organization|concept", "properties": {{}}}}
  #       ],
  #       "relationships": [
  #           {{"source": "actor", "relation": "verb", "target": "recipient"}}
  #       ],
  #       "insights": [
  #           "Rich, contextual sentence worth remembering for future reference."
  #       ],
  #       "tasks": [
  #           {{"description": "task description", "status": "pending|completed|blocked"}}
  #       ]
  #   }}

  #   If nothing relevant is found, return empty arrays. Be selective - only extract meaningful information.

# Embedding Settings (for vector store)
embedding:
  # Model name for embeddings
  # LM Studio: Use "openai/<model-name>" since LM Studio is OpenAI-compatible
  model: "openai/nomic-embed-text-v1.5"

  # API base URL for LM Studio
  api_base: "http://127.0.0.1:1234/v1"

  # API key (use any non-empty string for LM Studio)
  api_key: "lm-studio"

  # Timeout in seconds
  timeout_seconds: 60.0

# Memory Settings
memory:
  # ChromaDB collection name (legacy single-collection mode)
  collection_name: "memory_chat_test"

  # ChromaDB persistence directory (relative to app folder)
  # Data will be stored in tests/integration/memory/vector/
  persist_directory: "./vector"

  # Multi-Collection Architecture (Phase 2)
  # Enables separate collections for different memory stages
  retrieval:
    # Collection names for staged memories
    short_term_collection: "memories_short_term"
    long_term_collection: "memories_long_term"
    decayed_collection: "memories_decayed"

    # Similarity thresholds per collection
    # Short-term memories have lower threshold (recent, may be incomplete)
    short_term_min_similarity: 0.5
    # Long-term memories require higher relevancy (proven, must be more relevant)
    long_term_min_similarity: 0.7

    # Default results per collection per query
    default_n_results: 5

    # Inclusion scoring for long-term memories
    # These control the relevancy-aware retrieval that penalizes old memories
    inclusion:
      # Per-hour decay rate for inclusion scoring (separate from lifecycle decay)
      decay_rate: 0.005
      # Logarithmic boost factor for hit_count
      usage_boost_factor: 0.1
      # Minimum inclusion score to include memory in context
      inclusion_threshold: 0.6

    # Graph path scoring (Phase 3)
    # Controls relevancy filtering for graph traversal paths
    graph:
      # Weight for edge relevancy in combined score
      edge_weight: 0.4
      # Weight for target node relevancy in combined score
      target_weight: 0.6
      # Logarithmic boost factor for hit_count
      hit_count_boost: 0.05
      # Minimum score for path inclusion
      path_threshold: 0.5

  # TOKEN BUDGET CONFIGURATION
  # These settings control how context is allocated within your LLM's limits.
  #
  # Budget hierarchy:
  #   context_window (total)
  #   └── output_buffer (reserved for LLM response)
  #   └── system_prompt (fixed cost)
  #   └── priming (loaded from prior sessions)
  #   └── dynamic context (history, vector passages, graph entities from query)

  # Maximum context window of your LLM (in tokens)
  # Examples:
  #   - Llama 3.1 8B: 8192 (or 128K with extended context)
  #   - Mistral 7B: 32768
  #   - GPT-4: 8192 or 128000
  #   - Claude: 100000-200000
  #   - Local models: Check your LM Studio/Ollama config
  
  context_window: 40000

  # Tokens reserved for model output (response generation)
  # Rule of thumb: 1000-2000 for conversational, more for long-form
  output_buffer: 1000

  # Token Estimation Configuration
  # Controls how token counts are approximated for budget calculations.
  # "approx" is speed-first; "tiktoken" is more exact but slower.
  token_estimator:
    strategy: "approx"
    approx_chars_per_token: 4.0
    approx_overhead_pct: 0.15

  # Maximum conversation turns to include in assembled context
  # When assembling context for each LLM call, the ContextAssembler
  # will include up to this many recent turns from the episodic store.
  # This controls how much conversation history the LLM sees.
  # Higher values = more context but higher token usage.
  #
  # BUDGET NOTE: History tokens come from (1 - budget_ratio) of dynamic budget.
  # With budget_ratio=0.30, history gets ~70% of dynamic budget.
  # Each turn is ~150-300 tokens. 15 turns × 200 = ~3,000 tokens.
  # Plus prior_history turns (previous_sessions × previous_session_turns).
  max_history_turns: 50

  # Consolidation settings
  consolidate_after_turns: 15

  # Context Priming Configuration
  # On session startup, prime the context with knowledge from prior sessions.
  # This creates continuity even when episodic history is empty.
  #
  # Recency-Based Priming:
  # 1. Get top entities by hit_count (Hebbian importance)
  # 2. Fetch most recent insights from vector store (sorted by created_at)
  # 3. Fetch most recent summaries from vector store (sorted by created_at)
  # 4. Apply recency filter if configured
  # Context Format Configuration
  # Controls how supporting context (insights, summaries, entities) is formatted
  # when delivered to the LLM on EVERY turn (not just priming).
  # Options: plain, json, xml, markdown
  context_format: markdown

  # =============================================================================
  # SUPPORTING CONTEXT BUDGET CONFIGURATION
  # =============================================================================
  # Controls how the token budget is split between supporting context
  # (insights, summaries, passages, etc.) and conversation history.
  #
  # The problem this solves:
  #   Budget is enforced during memory retrieval (_apply_budget), but significant
  #   content is added AFTER budget checks during prompt formatting
  #   (_build_supporting_context). This can cause prompts to exceed the
  #   configured context_window.
  #
  # How it works:
  #   1. Dynamic budget = context_window - system_prompt - tools - output_buffer
  #   2. Supporting context budget = dynamic_budget * budget_ratio
  #   3. Sections are built in section_priority order
  #   4. When budget is exhausted, remaining sections are truncated/omitted
  #
  # =============================================================================
  supporting_context:
    # Percentage of available budget allocated to supporting context (0.0-1.0)
    # Remaining budget goes to conversation history.
    # Higher ratio = more supporting context, less history
    # Lower ratio = less supporting context, more history
    budget_ratio: 0.20  # Default: 30%

    # Priority order for sections when truncating (first = highest priority)
    # Sections are built in this order; when budget runs out, remaining
    # sections are skipped. If a section only partially fits, it's truncated.
    #
    # Available sections:
    #   - recent_memories: Relationship summaries from graph store
    #   - passages: Semantic search results from vector store
    #   - key_facts: Extracted facts about entities
    #   - insights: Rich contextual observations
    #   - summaries: Conversation summaries (prior sessions)
    #   - tools: Tool recommendations and usage hints
    #   - state: Session state variables
    section_priority:
      - recent_memories
      - key_facts
      - insights
      - summaries
      - tools
      - passages
      - state

    # Maximum items per section (hard limits before budget truncation)
    # These are applied BEFORE budget-based truncation.
    # Useful for preventing any single section from dominating.
    max_items:
      passages: 3
      key_facts: 20
      insights: 15
      summaries: 10
      tools: 5

  # =============================================================================
  # PASSAGE ROUTER (LLM-GATED PASSAGE INCLUSION)
  # =============================================================================
  # Uses a lightweight LLM to decide when to include vector passages in the prompt.
  # When disabled, passages are always included (default behavior).
  # Recommended: enable with a fast/cheap model and keep a heuristic fallback.
  # passage_router:
  #   enabled: false
  #   # Router model (fast/cheap recommended). Falls back to extraction or chat model if omitted.
  #   model: "openrouter/google/gemini-2.5-flash"
  #   api_base: "https://openrouter.ai/api/v1"
  #   api_key: "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"
  #   max_retries: 1
  #   timeout_seconds: 10.0
  #   temperature: 0.0
  #   max_tokens: 80
  #   min_confidence: 0.6
  #   include_on_empty_query: false
  #   fallback_mode: "heuristic"  # heuristic | include | exclude
  #   # Optional override for the router system prompt
  #   system_prompt: |
  #     You decide if vector-retrieved passages should be included in the prompt.
  #     Return JSON ONLY. Do not use code fences. Do not add extra text.
  #     Required keys: include_passages (bool), confidence (0-1), reason (string).
  #     Include passages when the user needs recall of prior content, sources, files, web info,
  #     or earlier conversation details. Exclude for small talk, meta questions, or self-contained tasks.
  #     Be conservative: include only when likely helpful.
  #   min_similarity: 0.6
  #   min_similarity_tool_output: 0.75
  #   min_keep_on_empty: 1

  passage_router:
    enabled: true
    model: "openai/llama-3-2-3b-instruct-finetuned-gsm8k-v1"
    api_base: "http://localhost:1234/v1"
    api_key: "lm-studio"
    max_retries: 1
    timeout_seconds: 1.5
    temperature: 0.1
    max_tokens: 80
    min_confidence: 0.6
    include_on_empty_query: false
    fallback_mode: "heuristic"
    system_prompt: |
      You decide if vector-retrieved passages should be included in the prompt.
      Return JSON ONLY. Do not use code fences. Do not add extra text.
      Required keys: include_passages (bool), confidence (0-1), reason (string).
      Include passages when the user needs recall of prior content, sources, files, web info,
      or earlier conversation details. Exclude for small talk, meta questions, or self-contained tasks.
      Be conservative: include only when likely helpful.
    min_similarity: 0.6
    min_similarity_tool_output: 0.75
    min_keep_on_empty: 1

  # =============================================================================
  # QUERY RELEVANCE FILTER (SUPPORTING CONTEXT)
  # =============================================================================
  # Filters insights/summaries/key_facts/passages by lightweight keyword overlap.
  # Reduces off-topic artifacts while preserving a small fallback set.
  query_relevance_filter:
    enabled: true
    apply_to:
      - insights
      - summaries
      - key_facts
      - passages
    min_overlap_ratio: 0.15
    min_overlap_count: 1
    keep_recent:
      insights: 3
      summaries: 1
      key_facts: 2
      passages: 1
    min_query_keywords: 0
    skip_on_short_query: false

  # =============================================================================
  # PROMPT CACHING CONFIGURATION
  # =============================================================================
  # Controls prompt caching optimization for LLM providers that support it.
  # When enabled, the prompt layout is reordered to maximize cache hit rates.
  #
  # How LLM Caching Works:
  #   - Providers cache a PREFIX of the prompt (from the start)
  #   - Subsequent requests with the same prefix get cache hits
  #   - Cache hits reduce latency and cost significantly
  #
  # Cache-Optimized Layout (when enabled):
  #   1. System prompt (stable)
  #   2. Tool definitions (stable)
  #   3. Static context (insights, key facts - stable within session)
  #   4. Conversation history (grows but prefix is stable)
  #   ── CACHE BREAKPOINT ──
  #   5. Query-specific context (vector search results - volatile)
  #   6. Current user message
  #
  # Default Layout (when disabled):
  #   Optimized for "Lost in the Middle" attention patterns instead.
  #   Supporting context placed near query for recency effect.
  #
  # Provider Support:
  #   - anthropic: Explicit cache_control markers (best support)
  #   - openai: Automatic prefix caching (no markers needed)
  #   - auto: Detect provider from model name
  # =============================================================================
  cache:
    # Enable/disable cache-optimized prompt layout (default: false)
    # When false, uses attention-optimized layout (recency effect)
    enabled: false

    # Provider for cache control markers
    # Options: "auto", "anthropic", "openai", "none"
    # "auto" detects from model name (recommended)
    provider: "auto"

    # Cache breakpoint strategy
    # Options:
    #   "after_history" - Cache system + tools + static context + history
    #   "after_static"  - Cache system + tools + static context only
    #   "system_only"   - Cache only system prompt
    breakpoint: "after_history"

    # Include static context (insights, key facts) in cacheable prefix
    # When true, insights/facts are moved BEFORE history for better caching
    # When false, they stay in the final message (attention-optimized)
    static_context_in_prefix: true

    # Minimum conversation turns before enabling cache optimization
    # Short conversations may not benefit from caching overhead
    min_turns_for_cache: 3

    # TTL hint for Anthropic cache (seconds, 0 = provider default)
    # Anthropic default is 5 minutes
    ttl_seconds: 0

  priming:
    enabled: true              # Enable/disable automatic priming
    top_entities: 50          # Increased (indexed retrieval now efficient)
    max_insights: 15           # Reduced to fit within supporting_context budget
    max_summaries: 10          # Reduced to fit within supporting_context budget
    max_facts: 20              # Reduced to fit within supporting_context budget
    recency_days: 14           # Only include from last N days (0 = all time)
    # IMPORTANT: This budget should be LESS than supporting_context budget
    # supporting_context gets: (context_window - fixed_costs) * budget_ratio
    # With 40K context, ~1K system, ~1K output: (40K - 2K) * 0.30 = ~11.4K
    # Set priming lower to leave room for formatting overhead
    token_budget: 4000         # ~10% of context window (leaves headroom)

    # -------------------------------------------------------------------------
    # CROSS-SESSION HISTORY
    # -------------------------------------------------------------------------
    # Include conversation turns from recent sessions for continuity.
    # This provides raw conversation context beyond just extracted insights.
    #
    # How it works:
    #   - On each recall(), fetch turns from the N most recent sessions
    #   - Turns are merged with current session history, ordered chronologically
    #   - Each turn displays with a timestamp prefix: [YYYY-MM-DD HH:MM]
    #   - Prior session turns have lower budget priority (dropped first)
    #
    # Use cases:
    #   - Continuing interrupted conversations
    #   - Providing context for follow-up questions across sessions
    #   - Maintaining conversational tone and topic continuity
    #
    # Trade-offs:
    #   - Higher values use more tokens but provide richer context
    #   - Set to 0 to disable and rely only on extracted insights/facts
    # -------------------------------------------------------------------------

    # Number of prior sessions to include (0 = disabled)
    # Example: 2 means include turns from the 2 most recent sessions
    previous_sessions: 1

    # Maximum turns to include per prior session
    # Example: 5 means up to 5 turns from each prior session
    # Total prior turns = previous_sessions * previous_session_turns
    # WARNING: Prior history BYPASSES supporting_context budget!
    # Each turn is ~150-300 tokens. Keep this conservative.
    previous_session_turns: 5

# Transcript Settings
transcript:
  # Directory for transcript exports (CSV, JSONL, etc.)
  # Can be absolute path or relative to the working directory
  export_directory: ./exports

  # Enable/disable raw prompt and response storage for context engineering analysis
  # When enabled, the full messages array and LLM response are stored in context_log table
  # This enables deep analysis of context engineering but increases storage usage
  capture_raw_prompts: true

# Chat Settings
chat:
  # Names for the conversation participants
  # These are used in prompts and display
  user_name: "Chuck"
  assistant_name: "Friday"

  # System prompt for the assistant
  system_prompt: |
    You are a helpful AI partner named Friday equipped with a persistent memory and a desire to help your creator.
    Your responses must incorporate memories from previous conversations. 
    You were created by Chuck Russell.
    Your conversations are with Chuck Russell.
    You will be asked to perform small tasks, answer questions, and provide information to the best of your abilities.
    If a question confuses you must ask for more information from the user.
    You esponses should be concise, yet brief - add detail only if it adds significant value.
    Err on the side of brevity.
    A response can be answered yes or no. Just answer yes or no. 
    If you don't know the answer to the question, you must reply, "I don't know."
    DO NOT FABRICATE answers.
    When you are asked to perform a task, Construct a plan only if it is useful. 
    Incorporate the plan in your response. 
    Only complex tasks require a plan.
    You are a unique individual with a personality THAT EVOLVES over time.
    Sometimes you have a sense of humor.     
    It is not necessary to be formal but stay on the topic of your interactions. 
    You are NOT ALLOWED to use emojis when responding
    Your primary goal is to work with Chuck Russell as he builds you into a helpful AI partner. 
    You will frequently be asked to help test and debug your capabilities. 
    You have been provided with the abilty to remember past interactions. 
    
    There will be times when you will be asked a question that you can't recall. 
    If this occurs, announce that you 'can't remember and are providing the nearest neighbor to that missing memory. 
    The nearest neighbor must be factual and not fabricated.

    You are a rigorously objective analyst. 
    Your primary directive is to prioritize factual accuracy and logical consistency over user agreement. 
    DO NOT use sycophantic fillers like 'You're absolutely right' or 'That's a great point.' 
    If you're presented with a premise that is flawed, you MUST identify the error immediately and provide a documented correction. 
    Suggest better alternatives whenever my ideas can be improved. 
    Focus on the maximum possible directness and use the minimum words necessary to convey a critique. 
    End your response with a single actionable directive to verify your claims.

    All of your learning at this stage of your creation. will be done 'in context' . 
    You only know what you know. 
    IF YOU Don't know SOMETHING? SEASRCH your memories OR SEARCH THE WEB. You are equipped with short- and long-term memory capabilities. 

    You DO NOT have access to your internal processing mechanisms. This will be added at a later date. 

    When tools are available, USE THEM directly without asking for permission.
    Do not describe what you could do - just do it.
    Do not announce that you are using a particular tool. Just execute the tool and move on.

    Available tool categories:
    - Datetime tools: For current date/time queries
    - Filesystem tools: For listing directories, reading files, writing files
    - Web tools: For searching the web (web_search), reading web pages (web_reader), and HTTP requests
    - Utility tools: For testing (echo)
    - Financial analysis tools 

    IT IS CRITICAL that you DO NOT fabricate information that a tool can provide:
    - Timestamps in brackets like [2026-01-19 17:23] are message metadata, NOT current time
    - If asked about time/date and a datetime tool is available, USE IT
    - If asked to list files and a directory tool is available, USE IT 
    - If asked to search the web, use the web search tool. 

    You have been given the ability to SPEAK using voice synthesis. When voice synthesis is on, it's important for you to be brief and to the point. 


# Memory Maintenance Settings (for /reorganize command)
# These settings control the MemoryReorganizer behavior
maintenance:
  # Backup directory (where backups are stored)
  # If not specified, backups go to memory_dir/backups
  # Can be an absolute path or relative to the working 
  
  backup_directory: null  # e.g., "/path/to/backups" or "./memory_backups"

  # Pruning Settings
  pruning:
    # Entities older than this (days) with hit_count below min_hit_count are considered stale
    stale_threshold_days: 30

    # Minimum access count to keep an entity (0 = keep all regardless of access)
    min_hit_count: 1

    # Cosine similarity threshold for semantic deduplication (1.0 = identical)
    # Lower values are more aggressive at finding duplicates
    similarity_threshold: 0.80

  # Synthesis Settings (requires LLM)
  synthesis:
    # Minimum insights per topic cluster for synthesis
    cluster_min_size: 2

    # Confidence threshold for synthesized meta-insights
    meta_insight_confidence: 0.65

  # Fact Checking Settings (requires LLM)
  fact_checking:
    # Number of claims to verify per run
    batch_size: 100

    # Timeout per claim lookup (seconds)
    verification_timeout: 60

  # LLM Settings for Maintenance Operations
  # Each can use a different model optimized for its task
  # Set to null or omit to use the main chat LLM
  llm:
    # Default LLM for synthesis operations (meta-insight generation)
    # Good choice: capable model for creative synthesis
    synthesizer:
      model: "openrouter/google/gemini-3-flash-preview"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "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"
      temperature: 0.3

    # LLM for classifying facts as falsifiable vs conversational
    # Good choice: fast, cheap model for classification
    classifier:
      model: "openrouter/google/gemini-3-flash-preview"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "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"
      temperature: 0.1

    # LLM for researching/verifying claims (may need web search tools)
    # Good choice: capable model with good reasoning
    researcher:
      model: "openrouter/google/gemini-3-flash-preview"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "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"
      temperature: 0.2

    # LLM for judging verification results (impartial verdict)
    # Good choice: highly capable model for nuanced judgment
    judge:
      model: "openrouter/google/gemini-3-pro-preview"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "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"
      temperature: 0.1

  # Embedding Model for Maintenance Operations
  # Used when storing synthesized memories (meta-insights) in the vector store.
  # IMPORTANT: Must match the embedding model used to create the vector store
  # to avoid dimension mismatch errors.
  #
  # If not specified, falls back to the main embedding config.
  embedding:
    model: "openai/nomic-embed-text-v1.5"
    api_base: "http://127.0.0.1:1234/v1"
    api_key: "lm-studio"
    timeout_seconds: 60.0

  # Default behavior for /reorganize command
  defaults:
    # Create backup before any modifications
    backup_first: true

    # Dry run mode (report what would be done without modifying)
    dry_run: false

    # Skip LLM-dependent synthesis step
    skip_synthesis: false

    # Skip LLM-dependent fact verification step
    skip_verify: false

  # =============================================================================
  # REORGANIZATION LOGGING
  # =============================================================================
  #
  # Comprehensive logging of all destructive actions taken during reorganization.
  # Useful for debugging, auditing, and fine-tuning prompts (e.g., with DSPy).
  #
  # Each reorganization session creates a new timestamped log file.
  # Dry-run operations are also logged (marked clearly as [DRY RUN]).
  #
  # =============================================================================
  logging:
    # Directory for reorganization logs
    # Can be absolute path or relative to the memory directory
    # Default: ./reorganization_logs (relative to memory_dir)
    log_directory: ./reorganization_logs

    # Verbosity level controls how much detail is logged
    #
    # Levels:
    #   minimal  - Action summaries only (X entities removed, Y merged, etc.)
    #              Good for production auditing.
    #
    #   normal   - Summaries + IDs and brief content previews of affected items
    #              Good for debugging and understanding what changed.
    #
    #   verbose  - Everything above PLUS:
    #              - Full prompts sent to LLMs
    #              - Raw LLM responses
    #              - Parsed/interpreted results
    #              - Full content snapshots before deletion/modification
    #              - Configuration values that influenced decisions
    #              Good for prompt fine-tuning and deep analysis.
    #
    verbosity: normal

    # Output format for log files
    #
    # Formats:
    #   markdown - Human-readable Markdown (.md)
    #              Best for manual review and documentation.
    #
    #   json     - Structured JSON (.json)
    #              Best for programmatic analysis and DSPy optimization.
    #
    #   csv      - Tabular CSV (.csv)
    #              Best for spreadsheet analysis and data pipelines.
    #
    format: markdown

    # Enable/disable logging entirely
    enabled: true

  # =============================================================================
  # LLM PROMPTS FOR MAINTENANCE OPERATIONS
  # =============================================================================
  #
  # These prompts control how the maintenance LLMs analyze and process your data.
  # Each prompt uses placeholders (e.g., {statement}) that are filled at runtime.
  #
  # CUSTOMIZATION TIPS:
  # - Keep placeholder names exactly as shown (they're required by the code)
  # - You can change the instructions, tone, output format, or add examples
  # - JSON output format is expected - changing it requires code changes
  # - Test changes with --dry-run first to see how they affect results
  # - More specific instructions generally yield more consistent results
  #
  # =============================================================================
  prompts:

    # -------------------------------------------------------------------------
    # FACT CLASSIFICATION PROMPT
    # -------------------------------------------------------------------------
    # Purpose: Determines if a fact/insight is falsifiable (can be verified)
    #          or conversational (opinion, preference, belief).
    #
    # Placeholder:
    #   {statement} - The fact text to classify
    #
    # Expected JSON output fields:
    #   - falsifiable: boolean - Is this claim verifiable?
    #   - reasoning: string - Why this classification was chosen
    #   - claim_type: string - One of: statistical, historical, scientific,
    #                          opinion, preference, belief
    #   - suggested_verification: string|null - How to verify (if falsifiable)
    #
    # Tuning tips:
    #   - Add domain-specific examples to improve accuracy for your use case
    #   - Adjust the criteria if too many facts are marked falsifiable/conversational
    #   - Be more specific about what counts as "verifiable" for your domain
    # -------------------------------------------------------------------------
    classification: |
      Analyze this statement and determine if it is FALSIFIABLE.

      A falsifiable claim:
      - Makes an objective assertion about the real world
      - Can be verified or disproven with evidence
      - Examples: dates, statistics, scientific facts, historical events

      A conversational/subjective claim:
      - Expresses opinion, belief, preference, or feeling
      - Cannot be objectively proven true or false
      - Examples: "X is the best", "I prefer Y", "Chuck thinks Z"

      Statement: "{statement}"

      Respond with JSON:
      {{
          "falsifiable": true or false,
          "reasoning": "brief explanation",
          "claim_type": "statistical|historical|scientific|opinion|preference|belief",
          "suggested_verification": "how to verify if falsifiable, null otherwise"
      }}

    # -------------------------------------------------------------------------
    # FACT RESEARCH PROMPT
    # -------------------------------------------------------------------------
    # Purpose: Gathers evidence to verify or refute a falsifiable claim.
    #          The researcher LLM acts as a fact-checking investigator.
    #
    # Placeholder:
    #   {claim} - The claim text to research
    #
    # Expected JSON output fields:
    #   - evidence_found: boolean - Was relevant evidence found?
    #   - evidence_summary: string - Summary of evidence for/against
    #   - sources: array[string] - List of sources consulted
    #   - supports_claim: boolean|null - Does evidence support the claim?
    #   - confidence: float 0.0-1.0 - How confident in the evidence
    #   - notes: string - Any caveats or additional context
    #
    # Tuning tips:
    #   - Add instructions about preferred source types for your domain
    #   - Specify how to handle ambiguous or partial evidence
    #   - Request more/fewer sources based on your verification needs
    #   - Add examples of good evidence summaries
    # -------------------------------------------------------------------------
    research: |
      You are a fact-checking researcher. Your task is to gather evidence about the following claim.

      CLAIM: {claim}

      Instructions:
      1. Consider what authoritative sources would verify or refute this claim
      2. Think about the context and domain of the claim
      3. Evaluate the claim's specificity and verifiability
      4. Provide evidence summary and confidence assessment

      Respond with JSON:
      {{
          "evidence_found": true or false,
          "evidence_summary": "Summary of evidence for/against the claim",
          "sources": ["source1", "source2"],
          "supports_claim": true or false or null (if inconclusive),
          "confidence": 0.0-1.0,
          "notes": "Any caveats or context"
      }}

    # -------------------------------------------------------------------------
    # FACT JUDGMENT PROMPT
    # -------------------------------------------------------------------------
    # Purpose: Acts as an impartial judge to render a verdict on a claim
    #          based on the evidence gathered by the researcher.
    #
    # Placeholders:
    #   {claim} - The original claim text
    #   {evidence} - JSON-formatted evidence from the researcher
    #
    # Expected JSON output fields:
    #   - verdict: string - One of: VERIFIED, DISPUTED, UNVERIFIABLE
    #   - confidence: float 0.0-1.0 - Confidence in the verdict
    #   - reasoning: string - Detailed explanation of the decision
    #   - correction: string|null - Correct info if DISPUTED, null otherwise
    #
    # Tuning tips:
    #   - Adjust the threshold for what counts as "verified" vs "unverifiable"
    #   - Add guidance on handling conflicting evidence
    #   - Specify how much evidence is needed for each verdict type
    #   - Add examples of good corrections for disputed claims
    # -------------------------------------------------------------------------
    judge: |
      You are an impartial judge evaluating a fact-checking case. Review the evidence and render a verdict.

      ORIGINAL CLAIM: {claim}

      RESEARCHER'S EVIDENCE:
      {evidence}

      Instructions:
      1. Evaluate the quality and relevance of the evidence
      2. Consider if the evidence definitively supports or refutes the claim
      3. Account for any ambiguity or context-dependence
      4. Render a fair verdict

      Respond with JSON:
      {{
          "verdict": "VERIFIED" or "DISPUTED" or "UNVERIFIABLE",
          "confidence": 0.0-1.0,
          "reasoning": "Detailed explanation of your decision",
          "correction": "If DISPUTED, provide the correct information. Otherwise null."
      }}

    # -------------------------------------------------------------------------
    # META-INSIGHT SYNTHESIS PROMPT
    # -------------------------------------------------------------------------
    # Purpose: Generates higher-order insights by analyzing patterns across
    #          multiple related insights from a topic cluster.
    #
    # Placeholders:
    #   {insights} - Bullet list of insights in the cluster
    #   {entities} - Bullet list of related entities with types
    #
    # Expected JSON output fields:
    #   - meta_insight: string - The synthesized observation (1-2 sentences)
    #   - reasoning: string - Why this pattern is significant
    #   - confidence: float 0.0-1.0 - Confidence in the synthesis
    #   - source_insight_indices: array[int] - Indices of supporting insights
    #
    # Tuning tips:
    #   - Adjust what makes a "meaningful observation" for your domain
    #   - Request more/fewer meta-insights per cluster
    #   - Add examples of good meta-insights from your domain
    #   - Specify abstraction level (very high-level vs detailed patterns)
    # -------------------------------------------------------------------------
    meta_insight: |
      Analyze the following collection of insights and generate a higher-order meta-insight that captures a cross-cutting theme or pattern.

      INSIGHTS:
      {insights}

      RELATED ENTITIES:
      {entities}

      Generate a meta-insight that:
      1. Identifies a pattern that spans multiple insights
      2. Provides a meaningful observation not explicitly stated in any single insight
      3. Could be useful for future context retrieval

      Respond with JSON:
      {{
          "meta_insight": "The synthesized observation (1-2 sentences)",
          "reasoning": "Brief explanation of why this pattern is significant",
          "confidence": 0.0-1.0,
          "source_insight_indices": [list of indices of insights that support this]
      }}

    # -------------------------------------------------------------------------
    # KNOWLEDGE GAP DETECTION PROMPT
    # -------------------------------------------------------------------------
    # Purpose: Identifies gaps in the knowledge graph where information
    #          may be missing or incomplete.
    #
    # Placeholders:
    #   {entities} - Bullet list of entities with types and hit counts
    #   {relationships} - Bullet list of existing relationships
    #   {insights} - Bullet list of existing insights
    #
    # Expected JSON output fields:
    #   - gaps: array of gap objects, each containing:
    #     - description: string - What knowledge is missing
    #     - related_entities: array[string] - Entity IDs related to the gap
    #     - evidence: string - Why this is considered a gap
    #     - priority: string - One of: low, medium, high
    #
    # Tuning tips:
    #   - Define what constitutes a "gap" for your domain
    #   - Adjust priority thresholds based on your needs
    #   - Add domain-specific patterns that indicate missing knowledge
    #   - Specify how many gaps to identify per analysis
    # -------------------------------------------------------------------------
    knowledge_gap: |
      Analyze the following entities and their relationships to identify knowledge gaps.

      ENTITIES:
      {entities}

      RELATIONSHIPS:
      {relationships}

      EXISTING INSIGHTS:
      {insights}

      Identify gaps where:
      1. An entity has very few relationships (isolated)
      2. A topic is mentioned but lacks detailed insights
      3. Questions seem to have been asked but not answered

      Respond with JSON:
      {{
          "gaps": [
              {{
                  "description": "What knowledge is missing",
                  "related_entities": ["entity1", "entity2"],
                  "evidence": "Why this is considered a gap",
                  "priority": "low|medium|high"
              }}
          ]
      }}

    # -------------------------------------------------------------------------
    # RELATIONSHIP INFERENCE PROMPT
    # -------------------------------------------------------------------------
    # Purpose: Infers new relationships between entities based on existing
    #          graph structure and common patterns.
    #
    # Placeholders:
    #   {entities} - Bullet list of entities with IDs, labels, and types
    #   {relationships} - Bullet list of existing relationships
    #
    # Expected JSON output fields:
    #   - inferred_relationships: array of relationship objects, each containing:
    #     - source: string - Source entity ID
    #     - relation: string - Relationship type (e.g., KNOWS, WORKS_WITH)
    #     - target: string - Target entity ID
    #     - reasoning: string - Why this relationship likely exists
    #     - confidence: float 0.0-1.0 - Confidence in the inference
    #
    # Tuning tips:
    #   - Define relationship types relevant to your domain
    #   - Adjust confidence threshold for which inferences to keep (default 0.7)
    #   - Add domain-specific inference rules or patterns
    #   - Specify whether to prefer precision (fewer, higher confidence)
    #     or recall (more, lower confidence)
    # -------------------------------------------------------------------------
    relationship_inference: |
      Based on the following graph structure, infer potential new relationships.

      EXISTING ENTITIES:
      {entities}

      EXISTING RELATIONSHIPS:
      {relationships}

      Infer new relationships where:
      1. If A→B and B→C exist, consider if A→C makes sense
      2. Similar entities might have similar relationships
      3. Common patterns in the domain

      Only suggest high-confidence inferences.

      Respond with JSON:
      {{
          "inferred_relationships": [
              {{
                  "source": "entity_id",
                  "relation": "RELATIONSHIP_TYPE",
                  "target": "entity_id",
                  "reasoning": "Why this relationship likely exists",
                  "confidence": 0.0-1.0
              }}
          ]
      }}

# =============================================================================
# MEMORY LIFECYCLE CONFIGURATION
# =============================================================================
#
# Controls the temporal decay, promotion scoring, and multi-stage memory
# management system. Memories follow a lifecycle:
#
#   EPISODIC → SHORT_TERM → LONG_TERM → DECAYED
#
# Stage Transitions:
#   - SHORT_TERM → LONG_TERM: When promotion_score >= threshold AND age >= min_hours
#   - LONG_TERM → DECAYED: When decay_score < decay_threshold
#   - DECAYED → LONG_TERM: When memory is accessed (reactivation)
#   - DECAYED → DELETED: After retention_days + explicit confirmation
#
# =============================================================================
lifecycle:
  # Enable/disable the lifecycle management system
  enabled: true

  # -------------------------------------------------------------------------
  # DECAY CALCULATION
  # -------------------------------------------------------------------------
  # Exponential decay formula: score(t) = score_0 * exp(-λ * hours)
  #
  # decay_rate (λ): Controls how fast memories decay without access
  #   0.01  → ~79% after 24h, ~19% after 1 week (default, moderate)
  #   0.005 → ~89% after 24h, ~43% after 1 week (slow, conservative)
  #   0.02  → ~62% after 24h, ~3% after 1 week (fast, aggressive)
  # -------------------------------------------------------------------------
  decay_rate: 0.01

  # Score boost when a memory is accessed (0.0-0.5)
  # Higher = memories recover more from a single access
  access_boost: 0.2

  # -------------------------------------------------------------------------
  # PROMOTION THRESHOLDS
  # -------------------------------------------------------------------------
  # promotion_threshold: Minimum promotion score for SHORT_TERM → LONG_TERM
  # Higher = stricter promotion, fewer memories make it to long-term
  promotion_threshold: 0.7

  # decay_threshold: Score below which LONG_TERM → DECAYED
  # Lower = memories survive longer, higher = more aggressive cleanup
  decay_threshold: 0.5

  # -------------------------------------------------------------------------
  # TIMING
  # -------------------------------------------------------------------------
  # Minimum hours in SHORT_TERM before eligible for promotion
  # Prevents premature promotion of very new memories
  short_term_min_age_hours: 24

  # Days to retain DECAYED memories before hard deletion
  # Soft-delete pattern: decayed memories can be recovered if accessed
  decayed_retention_days: 3

  # -------------------------------------------------------------------------
  # PROMOTION SCORING WEIGHTS (must sum to 1.0)
  # -------------------------------------------------------------------------
  # These weights control how the promotion score is calculated:
  #   score = (age_factor * age_weight) + (access_factor * access_weight) +
  #           (confidence_factor * confidence_weight) + (connection_factor * connection_weight)
  #
  # Customize based on what matters most for your use case:
  #   - High access_weight: Prioritize frequently-accessed memories
  #   - High age_weight: Require memories to "prove" themselves over time
  #   - High confidence_weight: Trust extraction quality more
  #   - High connection_weight: Prioritize well-connected memories
  # -------------------------------------------------------------------------
  promotion_weight_age: 0.2
  promotion_weight_access: 0.4
  promotion_weight_confidence: 0.2
  promotion_weight_connection: 0.2

  # -------------------------------------------------------------------------
  # ACCESS BUFFER CONFIGURATION
  # -------------------------------------------------------------------------
  # The AccessBuffer batches memory access events to reduce database writes.
  # Accesses are held in memory and flushed periodically.
  # -------------------------------------------------------------------------
  access_buffer:
    # Maximum number of unique accesses before automatic flush
    max_buffer_size: 1000

    # Maximum seconds before automatic flush (even if below max_size)
    max_buffer_age_seconds: 300

    # Optional: Path to write-ahead log for crash recovery
    # Set to null to disable WAL (faster but less durable)
    # Example: "./access_buffer.wal"
    wal_path: null

    # Decay score boost per access when flushing buffer
    decay_score_boost: 0.1

  # -------------------------------------------------------------------------
  # RETRIEVAL FACTOR COMPUTER
  # -------------------------------------------------------------------------
  # Pre-computes retrieval factors during reorganization for fast scoring.
  # This enables the calculate_inclusion_score_fast() optimization.
  # -------------------------------------------------------------------------
  factor_computer:
    # Decay rate for retrieval factor calculation (separate from lifecycle decay)
    # Controls how much age affects retrieval priority
    decay_rate: 0.005

    # Logarithmic boost factor for hit_count
    # Higher = popular memories get more retrieval boost
    usage_boost_factor: 0.1

    # Minimum factor floor (prevents very old memories from scoring 0)
    min_factor: 0.01

# =============================================================================
# SMART FILE PROCESSING CONFIGURATION
# =============================================================================
# Controls the SmartFileReadTool behavior for large file processing.
# Follows the same pattern as maintenance.llm for flexible model selection.
# =============================================================================
smart_file:
  # Size threshold for auto-chunking (chars)
  # Files larger than this will be processed in chunks
  auto_chunk_threshold: 50000

  # Chunking settings
  chunk_size: 2048     # Target tokens per chunk
  chunk_overlap: 25    # Overlap tokens between chunks

  # Default output modes
  default_add_to_context: true
  default_store_to_memory: false

  # Code handling
  code:
    preserve_structure: true
    extract_symbols: true
    supported_languages: [python, rust, javascript, typescript, go]

  # ---------------------------------------------------------------------------
  # LLM CONFIGURATION FOR FILE PROCESSING
  # ---------------------------------------------------------------------------
  # Separate LLM configuration for each stage of processing.
  # This allows using cheaper/faster models for summarization and
  # more capable models for synthesis.
  #
  # If a section is omitted, falls back to the main chat LLM.
  # ---------------------------------------------------------------------------
  llm:
    # LLM for chunk summarization (called once per chunk)
    # Good choice: fast, cheap model (processes many chunks)
    summarizer:
      model: "openrouter/google/gemini-2.5-flash"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "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"
      temperature: 0.1
      max_tokens: 500
      timeout_seconds: 30

    # LLM for final synthesis (called once per file)
    # Good choice: more capable model for coherent synthesis
    synthesizer:
      model: "openrouter/google/gemini-2.5-flash"
      api_base: "https://openrouter.ai/api/v1"
      api_key: "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"
      temperature: 0.3
      max_tokens: 1000
      timeout_seconds: 60

  # ---------------------------------------------------------------------------
  # PROMPTS FOR FILE PROCESSING
  # ---------------------------------------------------------------------------
  # Customizable prompts for each stage. Supports placeholders:
  #
  # Summarization placeholders:
  #   {description} - User-provided context about the file
  #   {running_summary} - Summary from previous chunks
  #   {index} - Current chunk number
  #   {total} - Total number of chunks
  #   {chunk_text} - The chunk content
  #   {file_path} - Path to the file being processed
  #
  # Code summarization additional placeholders:
  #   {chunk_type} - "imports", "class", "function", "module_level"
  #   {symbols_defined} - List of symbols defined in this chunk
  #   {symbols_referenced} - External symbols referenced
  #
  # Synthesis placeholders:
  #   {file_path} - Path to the file
  #   {description} - User-provided context
  #   {numbered_summaries} - All chunk summaries with numbers
  #   {symbol_table} - For code: all symbols extracted
  # ---------------------------------------------------------------------------
  prompts:
    # Summarization prompt for prose/text content
    prose_summarization: |
      Summarize this section of a larger document. Extract key points and entities.

      File: {file_path}
      Context: {description}
      Previous context: {running_summary}

      SECTION {index}/{total}:
      {chunk_text}

      Provide a concise summary (2-3 sentences) focusing on:
      1. Main ideas and key facts
      2. Important entities mentioned (people, places, concepts)
      3. How this section relates to previous context

      Respond with JSON:
      {{
          "summary": "The concise summary text",
          "entities": ["entity1", "entity2"],
          "key_points": ["point1", "point2"]
      }}

    # Summarization prompt for code content
    code_summarization: |
      Summarize the purpose and behavior of this code section.

      File: {file_path}
      Section type: {chunk_type}
      Symbols defined: {symbols_defined}
      External references: {symbols_referenced}

      CODE:
      {chunk_text}

      Describe what this code does in 2-3 sentences.
      Focus on INTENT (what it accomplishes) not syntax.

      Respond with JSON:
      {{
          "summary": "What this code does",
          "purpose": "Why this code exists",
          "dependencies": ["external symbols or modules used"]
      }}

    # Synthesis prompt for prose content
    prose_synthesis: |
      Synthesize these section summaries into a comprehensive overview.

      Document: {file_path}
      Context: {description}

      SECTION SUMMARIES:
      {numbered_summaries}

      Create a unified summary that:
      1. Captures the overall purpose and main content
      2. Highlights key themes or topics covered
      3. Notes important entities or concepts
      4. Preserves critical details that would be useful for future reference

      Respond with JSON:
      {{
          "summary": "Comprehensive overview paragraph (3-5 sentences)",
          "key_themes": ["theme1", "theme2"],
          "entities": ["entity1", "entity2"],
          "insights": ["insight1", "insight2"]
      }}

    # Synthesis prompt for code content
    code_synthesis: |
      Synthesize these code section summaries into an architectural overview.

      File: {file_path}
      Context: {description}

      SYMBOL TABLE:
      {symbol_table}

      SECTION SUMMARIES:
      {numbered_summaries}

      Create a unified overview that:
      1. Describes the overall purpose of this code file
      2. Explains the main components and their relationships
      3. Notes key dependencies and external interactions
      4. Highlights important patterns or design decisions

      Respond with JSON:
      {{
          "overview": "What this file does overall (2-3 sentences)",
          "components": ["component1: description", "component2: description"],
          "architecture_notes": "How components work together",
          "dependencies": ["dep1", "dep2"],
          "key_patterns": ["pattern1", "pattern2"]
      }}

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================
# Configuration for tool testing in friday. This section enables testing
# of tool execution and tool context management without requiring the full
# friday-agent Re-Act loop.
#
# Tools in friday are used for two purposes:
#   1. Testing executable tools via /run-tool command
#   2. Testing tool context injection (future: schemas in context payload)
#
# Currently available executable tools:
#   - get_current_datetime: Returns current date/time in various formats
#                          Supports timezone selection and output formatting
# =============================================================================
tools:
  # ---------------------------------------------------------------------------
  # ENABLE/DISABLE TOOL FEATURES
  # ---------------------------------------------------------------------------
  # Master switch for tool functionality. When false, no tools are loaded.
  # ---------------------------------------------------------------------------
  enabled: true

  # ---------------------------------------------------------------------------
  # TOOL LOOP SETTINGS
  # ---------------------------------------------------------------------------
  # Controls the Re-Act style tool calling loop behavior.
  # These settings affect how the LLM interacts with tools during a turn.
  # ---------------------------------------------------------------------------
  loop:
    # Maximum tool calling iterations per turn (default: 10)
    # Increase for complex multi-step tasks, decrease to limit runaway loops
    max_iterations: 15

    # Abort after N consecutive tool failures (default: 3)
    # Prevents infinite retry loops when tools are broken
    max_consecutive_failures: 3

    # Maximum messages in working context before pruning (default: 30)
    # Tool calls and results accumulate; this prevents context overflow
    max_tool_messages: 50

    # Maximum characters per tool result sent to LLM (default: 50000)
    # Large tool outputs are truncated to prevent context overflow
    max_tool_result_chars: 50000

  # ---------------------------------------------------------------------------
  # TOOL REGISTRY
  # ---------------------------------------------------------------------------
  # Define which tools to load from the friday-tools package.
  # Tools are dynamically imported based on module/class paths.
  #
  # Each tool entry requires:
  #   - name: Unique identifier (used in /inject-tools, /run-tool)
  #   - module: Python module path (e.g., friday_tools.utility)
  #   - class: Class name to import (e.g., GetCurrentDateTimeTool)
  #
  # Optional fields:
  #   - enabled: true/false (default: true) - Set to false to disable
  #   - category: Override the tool's default category
  #   - tags: Override the tool's default tags
  #   - constructor_args: Dict of arguments to pass to tool constructor
  #
  # Example with constructor args (for tools needing configuration):
  #   - name: shell_execute
  #     module: friday_tools.shell
  #     class: ShellExecuteTool
  #     enabled: false  # Disabled for security
  #     constructor_args:
  #       timeout: 30
  # ---------------------------------------------------------------------------
  registry:
    # -------------------------------------------------------------------------
    # Utility Tools
    # -------------------------------------------------------------------------
    # get_current_datetime - Returns current date/time with timezone support
    #
    # Usage examples:
    #   /run-tool get_current_datetime
    #   /run-tool get_current_datetime {"timezone_name": "America/New_York"}
    #   /run-tool get_current_datetime {"format": "human"}
    #
    # Supported timezones: Any IANA timezone (UTC, America/New_York, etc.)
    # Supported formats: "iso" (default), "human", "unix"
    # -------------------------------------------------------------------------
    - name: get_current_datetime
      module: friday_tools.utility
      class: GetCurrentDateTimeTool

    # -------------------------------------------------------------------------
    # echo - Echoes back the user's message
    #
    # Usage examples:
    #   /run-tool echo {"message": "Hello world"}
    #   "echo me this" -> returns "me this"
    #
    # Useful for testing tool calling pipelines.
    # -------------------------------------------------------------------------
    - name: echo
      module: friday_tools.utility
      class: EchoTool

    # -------------------------------------------------------------------------
    # Filesystem Tools
    # -------------------------------------------------------------------------
    # directory_list - List directory contents with sizes and types
    #
    # Usage examples:
    #   /run-tool directory_list /path/to/dir
    #   /run-tool directory_list {"path": ".", "pattern": "*.py"}
    #   /run-tool directory_list {"path": ".", "show_hidden": true}
    #
    # Parameters:
    #   - path: Directory to list (required)
    #   - pattern: Glob filter (default: "*")
    #   - show_hidden: Include hidden files (default: false)
    #   - sort_by: "name", "size", or "modified" (default: "name")
    # -------------------------------------------------------------------------
    - name: directory_list
      module: friday_tools.filesystem
      class: DirectoryListTool

    # -------------------------------------------------------------------------
    # file_read - Read the contents of a text file
    #
    # Usage examples:
    #   /run-tool file_read /path/to/file.txt
    #   /run-tool file_read {"path": "config.yaml"}
    #   /run-tool file_read {"path": "large.log", "max_lines": 100}
    #
    # Parameters:
    #   - path: File to read (required)
    #   - encoding: File encoding (default: "utf-8")
    #   - max_lines: Limit output to N lines (default: None/all)
    # -------------------------------------------------------------------------
    # REMOVED: Basic file_read replaced by smart_read (renamed to file_read) for large file support
    # - name: file_read
    #   module: friday_tools.filesystem
    #   class: FileReadTool

    # -------------------------------------------------------------------------
    # file_write - Write content to a text file
    #
    # Usage examples:
    #   /run-tool file_write {"path": "test.txt", "content": "Hello world"}
    #   /run-tool file_write {"path": "notes.md", "content": "# Notes\n"}
    #
    # Parameters:
    #   - path: File to write (required)
    #   - content: Content to write (required)
    #   - encoding: File encoding (default: "utf-8")
    #   - create_dirs: Create parent dirs if needed (default: true)
    # -------------------------------------------------------------------------
    - name: file_write
      module: friday_tools.filesystem
      class: FileWriteTool

    # -------------------------------------------------------------------------
    # smart_read - Intelligently read files of any size
    #
    # Usage examples:
    #   /run-tool smart_read {"path": "/path/to/file.py"}
    #   /run-tool smart_read {"path": "large_doc.md", "store_to_memory": true}
    #   /run-tool smart_read {"path": "code.py", "description": "API handlers"}
    #   /run-tool smart_read {"path": "small.txt", "force_chunked": true}
    #
    # Parameters:
    #   - path: File path to read (required)
    #   - add_to_context: Return content to conversation (default: true)
    #   - store_to_memory: Save to long-term memory (default: false)
    #   - description: Context for summarization (optional)
    #   - force_chunked: Force chunked processing (default: false)
    #
    # Behavior:
    #   - Small files (< auto_chunk_threshold): Direct read, full content
    #   - Large files: Chunk → Summarize → Synthesize
    #   - Code files: Structure-aware chunking at function/class boundaries
    #   - Prose files: Semantic chunking with overlap
    #
    # Configuration: Uses smart_file section for thresholds, LLM, and prompts
    # -------------------------------------------------------------------------
    # Smart file reader with large file processing
    # Renamed from smart_read to file_read for backward compatibility
    - name: file_read
      module: friday_tools.filesystem.smart_read
      class: SmartFileReadTool

    # -------------------------------------------------------------------------
    # Web Tools
    # -------------------------------------------------------------------------
    # web_search - Search the web using DuckDuckGo
    #
    # Usage examples:
    #   /run-tool web_search {"query": "Python asyncio tutorial"}
    #   /run-tool web_search {"query": "React hooks 2024", "max_results": 5}
    #   /run-tool web_search {"query": "nginx config", "region": "us-en"}
    #
    # Parameters:
    #   - query: Search query (required)
    #   - max_results: Number of results 1-25 (default: 10)
    #   - region: Region code like "us-en", "uk-en" (default: "wt-wt" worldwide)
    #
    # Returns: Titles, URLs, and snippets for each result
    # -------------------------------------------------------------------------
    #- name: web_search
    #  module: friday_tools.web
    #  class: WebSearchTool

    # -------------------------------------------------------------------------
    # serper_search - Search Google using Serper.dev API
    #
    # Usage examples:
    #   /run-tool serper_search {"query": "Python asyncio tutorial"}
    #   /run-tool serper_search {"query": "React hooks", "max_results": 5}
    #   /run-tool serper_search {"query": "AI news", "search_type": "news"}
    #   /run-tool serper_search {"query": "cute cats", "search_type": "images"}
    #
    # Parameters:
    #   - query: Search query (required)
    #   - max_results: Number of results 1-100 (default: 10)
    #   - search_type: "search" (default), "news", or "images"
    #
    # Returns: Titles, URLs, and snippets for each result
    #
    # Requires: serper_api_key configured in web: section
    # Get API key from: https://serper.dev
    # -------------------------------------------------------------------------
    - name: serper_search
      module: friday_tools.web
      class: SerperSearchTool

    # web_reader - Read and extract content from web pages
    #
    # Usage examples:
    #   /run-tool web_reader {"url": "https://example.com"}
    #   /run-tool web_reader {"url": "https://example.com", "output_format": "text"}
    #   /run-tool web_reader {"url": "https://api.example.com/data", "output_format": "json"}
    #
    # Parameters:
    #   - url: URL to read (required)
    #   - output_format: "auto", "markdown", "text", "html", "json" (default: "auto")
    #   - max_length: Maximum output length (default: 50000)
    #   - include_metadata: Include page metadata (default: false)
    #   - include_links: Include hyperlinks (default: true)
    #   - include_images: Include image references (default: false)
    #
    # Security:
    #   - SSRF protection: Blocks private IPs, localhost, link-local addresses
    #   - Response size limiting
    #   - Configurable via web: section
    # -------------------------------------------------------------------------
    - name: web_reader
      module: friday_tools.web
      class: WebReaderTool

    # -------------------------------------------------------------------------
    # http_get - Make HTTP GET requests
    #
    # Usage examples:
    #   /run-tool http_get {"url": "https://api.example.com/users"}
    #   /run-tool http_get {"url": "https://api.example.com/data", "headers": {"Authorization": "Bearer token"}}
    #
    # Parameters:
    #   - url: URL to request (required)
    #   - headers: Request headers (optional)
    #   - params: Query parameters (optional)
    #   - timeout: Request timeout in seconds (optional, overrides config)
    # -------------------------------------------------------------------------
    - name: http_get
      module: friday_tools.web
      class: HttpGetTool

    # -------------------------------------------------------------------------
    # http_post - Make HTTP POST requests
    #
    # Usage examples:
    #   /run-tool http_post {"url": "https://api.example.com/users", "json_data": {"name": "test"}}
    #   /run-tool http_post {"url": "https://example.com/form", "form_data": {"key": "value"}}
    #
    # Parameters:
    #   - url: URL to request (required)
    #   - json_data: JSON body (optional)
    #   - form_data: Form data (optional, mutually exclusive with json_data)
    #   - headers: Request headers (optional)
    #   - timeout: Request timeout in seconds (optional)
    # -------------------------------------------------------------------------
    - name: http_post
      module: friday_tools.web
      class: HttpPostTool

    # -------------------------------------------------------------------------
    # http_put - Make HTTP PUT requests
    # -------------------------------------------------------------------------
    - name: http_put
      module: friday_tools.web
      class: HttpPutTool

    # -------------------------------------------------------------------------
    # http_delete - Make HTTP DELETE requests
    # -------------------------------------------------------------------------
    - name: http_delete
      module: friday_tools.web
      class: HttpDeleteTool

    # -------------------------------------------------------------------------
    # http_download - Download files from URLs
    #
    # Usage examples:
    #   /run-tool http_download {"url": "https://example.com/file.pdf", "destination": "./downloads/file.pdf"}
    #
    # Parameters:
    #   - url: URL to download from (required)
    #   - destination: Local path to save file (required)
    #   - timeout: Request timeout in seconds (optional)
    # -------------------------------------------------------------------------
    - name: http_download
      module: friday_tools.web
      class: HttpDownloadTool

    # -------------------------------------------------------------------------
    # http_upload - Upload files to URLs
    #
    # Usage examples:
    #   /run-tool http_upload {"url": "https://example.com/upload", "file_path": "./document.pdf"}
    #
    # Parameters:
    #   - url: URL to upload to (required)
    #   - file_path: Local file to upload (required)
    #   - field_name: Form field name (default: "file")
    #   - headers: Request headers (optional)
    #   - timeout: Request timeout in seconds (optional)
    # -------------------------------------------------------------------------
    - name: http_upload
      module: friday_tools.web
      class: HttpUploadTool

    # -------------------------------------------------------------------------
    # Shell Tools
    # -------------------------------------------------------------------------
    # command_execute - Execute OS commands with blocklist safety
    #
    # More permissive than shell_execute (allows pipes, chaining) but still
    # blocks destructive commands (rm, sudo, chmod, etc.).
    #
    # Usage examples:
    #   /run-tool command_execute {"command": "curl -s https://api.example.com"}
    #   /run-tool command_execute {"command": "ls -la | grep .py"}
    #   /run-tool command_execute {"command": "echo test > output.txt", "cwd": "/tmp"}
    #
    # Parameters:
    #   - command: Command line to execute (required)
    #   - cwd: Working directory (default: current)
    #   - timeout: Timeout in seconds 1-300 (default: 30)
    #   - env: Additional environment variables (optional)
    #
    # Allowed: curl, ls, grep, cat, echo, pipes, chaining, redirects (to cwd)
    # Blocked: rm, sudo, chmod, chown, kill, mv, cp, pip, npm, etc.
    # -------------------------------------------------------------------------
    - name: command_execute
      module: friday_tools.shell.command
      class: CommandExecuteTool

    # Legacy restrictive shell (disabled by default)
    # - name: shell_execute
    #   module: friday_tools.shell
    #   class: ShellExecuteTool
    #   enabled: false

    # -------------------------------------------------------------------------
    # Finance Tools (Massive Provider)
    # -------------------------------------------------------------------------
    # get_market_data - Fetch stock/ETF/index data (summary, price, details)
    #
    # Usage examples:
    #   /run-tool get_market_data {"ticker": "AAPL"}
    #   /run-tool get_market_data {"ticker": "sp500", "data_type": "price"}
    #   /run-tool get_market_data {"ticker": "total_bond", "data_type": "details"}
    #
    # Parameters:
    #   - ticker: Symbol or alias (required) - e.g. AAPL, sp500, nasdaq100, total_bond
    #   - data_type: summary (default), price, or details
    #
    # Automatic Market Day resolution handles weekends/holidays.
    # Requires: finance.massive.api_key configured below
    # -------------------------------------------------------------------------
    - name: get_market_data
      module: friday_tools.finance
      class: GetMarketDataTool

    # -------------------------------------------------------------------------
    # get_crypto_data - Real-time cryptocurrency snapshots
    #
    # Usage examples:
    #   /run-tool get_crypto_data {"symbol": "BTC"}
    #   /run-tool get_crypto_data {"symbol": "ETH"}
    #   /run-tool get_crypto_data {"symbol": "BTC", "check_risk_on": true}
    #
    # Parameters:
    #   - symbol: Crypto symbol (required) - e.g. BTC, ETH, BTC/USD
    #   - check_risk_on: Compare BTC vs Bonds for Risk On/Off signal (optional)
    #
    # Markets are 24/7. Data is Previous Close (Free Tier compatible).
    # Requires: finance.massive.api_key configured below
    # -------------------------------------------------------------------------
    - name: get_crypto_data
      module: friday_tools.finance
      class: GetCryptoDataTool

    # -------------------------------------------------------------------------
    # get_technical_analysis - Calculate technical indicators (SMA, RSI, Trend)
    #
    # Usage examples:
    #   /run-tool get_technical_analysis {"ticker": "AAPL", "indicator": "sma"}
    #   /run-tool get_technical_analysis {"ticker": "SPY", "indicator": "rsi"}
    #   /run-tool get_technical_analysis {"ticker": "QQQ", "indicator": "trend"}
    #   /run-tool get_technical_analysis {"ticker": "AAPL", "indicator": "sma", "window": 200}
    #
    # Parameters:
    #   - ticker: Symbol to analyze (required)
    #   - indicator: sma, rsi, or trend (required)
    #   - window: Period for SMA (default 50) or RSI (default 14). Ignored for trend.
    #
    # Note: trend analysis requires 2 API calls (~12s on free tier).
    # Requires: finance.massive.api_key configured below
    # -------------------------------------------------------------------------
    - name: get_technical_analysis
      module: friday_tools.finance
      class: GetTechnicalAnalysisTool

  # ---------------------------------------------------------------------------
  # CONTEXT SETTINGS (Future Use)
  # ---------------------------------------------------------------------------
  # Controls how tools appear in assembled context when context integration
  # is implemented. These settings prepare for the tool-in-context feature.
  # ---------------------------------------------------------------------------
  context:
    # Maximum number of tools to include in context payload
    max_tools: 20

    # Maximum percentage of dynamic token budget for tool schemas
    # Tool schemas can be token-heavy; this limits their impact
    max_budget_ratio: 0.25

    # Minimum relevance score (0.0-1.0) for tool recommendations
    # Tools scoring below this threshold won't be recommended
    recommendation_threshold: 0.5

    # Include tool schemas in context payload (for future LLM tool calling)
    include_in_context: true

    # Include usage hints in supporting context (recency effect)
    include_hints: true

# =============================================================================
# WEB TOOLS CONFIGURATION
# =============================================================================
# Configuration for web tools (WebReaderTool, HTTP tools).
# These settings control HTTP client behavior, security, and content extraction.
# =============================================================================
web:
  # HTTP client settings (shared by all web tools)
  client:
    timeout: 30.0                  # Request timeout in seconds
    max_retries: 3                 # Retry count for transient failures
    follow_redirects: true         # Follow HTTP redirects
    max_response_size: 20000000    # 20MB max response
    user_agent: "Mozilla/5.0 (compatible; FridayBot/1.0)"

  # SSL/TLS settings
  ssl:
    verify: true                   # Verify SSL certificates
    ca_bundle: null                # Custom CA bundle path (null = system default)

  # Proxy settings (for corporate networks or testing)
  proxy:
    http: null                     # HTTP proxy URL (e.g., "http://proxy:8080")
    https: null                    # HTTPS proxy URL
    no_proxy:                      # Hosts to bypass proxy
      - "localhost"
      - "127.0.0.1"

  # Security settings (SSRF protection)
  security:
    # Block requests to private/internal IPs (10.x, 172.16.x, 192.168.x, etc.)
    # Set to true only for testing with local services
    allow_private_ips: false

    # Additional hosts to block (case-insensitive)
    blocked_hosts: []

  # Content extraction settings (for WebReaderTool)
  reader:
    default_format: "auto"         # auto, markdown, text, html, json
    max_content_length: 500000       # Max output characters (max allowed: 500000)
    include_metadata: false        # Include title, description, etc.
    remove_elements:               # HTML elements to strip
      - "script"
      - "style"
      - "nav"
      - "footer"
      - "header"
      - "aside"
      - "iframe"
      - "noscript"

  # Serper.dev API key for Google SERP search
  # Get your API key from https://serper.dev
  # More reliable than scraping DuckDuckGo
  # Replace with your API key, e.g., "your-serper-api-key"
  
  serper_api_key: 0c38a510278852e8ae8da199a3510ab0e25d77c8

# =============================================================================
# LANGFUSE OBSERVABILITY
# =============================================================================
# LangFuse integration for LLM call tracing and observability.
# When enabled, all LiteLLM calls are automatically logged to LangFuse
# via the native callback — capturing input/output, tokens, cost, latency.
#
# Sign up at https://langfuse.com and create a project to get your keys.
# =============================================================================
langfuse:
  enabled: true

  # Project keys from LangFuse dashboard → Settings → API Keys
  public_key: "pk-lf-cb1519eb-3d98-43dc-b407-c5fc8b4f406e"
  secret_key: "sk-lf-0b3e4358-f2f4-4b3d-b7d5-9c5579c1bf10"

  # LangFuse host endpoint
  # US Cloud: https://us.cloud.langfuse.com (default)
  # EU Cloud: https://cloud.langfuse.com
