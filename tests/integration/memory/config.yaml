  host: "https://us.cloud.langfuse.com"

# =============================================================================
# FINANCE TOOLS CONFIGURATION
# =============================================================================
# Configuration for finance tools (Massive provider).
# These settings control API access and rate limiting for financial data.
#
# The Massive provider supports:
#   - Equities: Stock/ETF/Index data with market-day resolution
#   - Crypto: Real-time cryptocurrency snapshots (24/7)
#   - Indicators: Technical analysis (SMA, RSI, Trend/Golden Cross)
#
# Tier limits:
#   - free: 5 requests/minute (~12s spacing enforced by governor)
#   - starter: Effectively unlimited
# =============================================================================
finance:
  massive:
    # API key from Massive (https://massive.io)
    # Required for all finance tools. Set to null to disable finance tools.
    api_key: pQBVbd4spIQEVEfc5WRjAonQXwBl_grA

    # API tier - controls rate limiting governor
    # "free" = 5 req/min (12s spacing), "starter" = effectively unlimited
    tier: "free"

# =============================================================================
# SECURITY SETTINGS
# =============================================================================
# Prompt injection mitigation for tool outputs.
# =============================================================================
security:
  sanitization:
    enabled: true

    detection:
      enabled: true
      sensitivity: medium  # low | medium | high | paranoid
      max_scan_length: 100000
      custom_patterns: []
      allowlist_patterns: []

    normalization:
      enabled: true
      max_normalize_length: 200000
      strip_zero_width: true
      decode_html_entities: true
      strip_html_comments: true
      collapse_whitespace: true

    wrapping:
      enabled: true
      marker_style: xml  # xml | fence | prefix
      include_metadata: true

    quarantine:
      action: warn  # warn | redact | block | log_only
      redaction_text: "[CONTENT REDACTED: Potential injection detected]"
      log_detections: true

    storage_policy:
      store_sanitized: true
      store_raw_on_detection: true
      raw_store_mode: quarantine
      quarantine_path: ".friday/quarantine/tool_outputs.jsonl"

    category_risks:
      web: critical
      shell: critical
      filesystem: high
      git: medium
      code: medium
      data: medium
      text: low
      utility: minimal

    tool_overrides:
      web_reader: critical
      command_execute: critical

# =============================================================================
# SESSION SETTINGS
# =============================================================================
# Controls session behavior including automatic maintenance on exit.
# These settings determine what cleanup and optimization runs when you exit.
# =============================================================================
session:
  # ---------------------------------------------------------------------------
  # EXIT MAINTENANCE
  # ---------------------------------------------------------------------------
  # Run memory maintenance automatically when exiting the chat.
  # This keeps your memory system healthy without manual intervention.
  # ---------------------------------------------------------------------------

  # Flush access buffer on exit (default: true)
  # Fast operation (~1 second) - ensures access counts are persisted
  # Recommended: Always enable
  flush_on_exit: true

  # Run lifecycle cycle on exit (default: true)
  # Moderate operation (~2-5 seconds) - processes promotions and decays
  # - Promotes valuable SHORT_TERM memories to LONG_TERM
  # - Decays unused LONG_TERM memories
  # - Propagates decay to graph nodes
  # Recommended: Enable for regular usage
  lifecycle_on_exit: true

  # Run reorganization on exit (default: false)
  # Slow operation (10 seconds to 5 minutes depending on mode)
  # - Analyzes memory consistency
  # - Prunes duplicate entities and insights
  # - Optionally synthesizes meta-insights (full mode)
  # - Optionally verifies facts (full mode)
  # Recommended: Enable for power users who want self-maintaining memory
  reorganize_on_exit: true

  # Reorganization mode: "fast" or "full" (default: "fast")
  # Only applies when reorganize_on_exit is true
  #
  # "fast" mode (~10-30 seconds):
  #   - Backup, Analyze, Prune
  #   - No LLM calls
  #   - Safe for frequent use
  #
  # "full" mode (~2-5 minutes):
  #   - All steps including Synthesize and Verify
  #   - Requires LLM calls
  #   - Best for weekly/monthly maintenance
  reorganize_mode: "fast"

