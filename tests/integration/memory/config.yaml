# Friday-Memory Integration Test Configuration
#
# This config file controls LLM, embedding, and memory settings
# for the memory-chat.py interactive CLI.

# Logging Settings
logging:
  # Global log level: DEBUG, INFO, WARNING, ERROR
  level: INFO

  # Enable verbose extraction logging (shows full LLM extraction responses)
  # Set to true for debugging extraction issues
  extraction_debug: false

# LLM Provider Settings (for chat completions)

