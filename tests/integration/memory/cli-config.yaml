# Friday CLI Display Configuration
#
# Optional configuration for customizing the look and feel of the terminal interface.
# If this file doesn't exist, sensible defaults are used.
#
# This file is loaded from the same directory as config.yaml.
# Delete or rename this file to use defaults.

# =============================================================================
# THEME COLORS
# =============================================================================
# Rich color styles for status messages and highlights.
#
# Supported styles:
#   Colors: black, red, green, yellow, blue, magenta, cyan, white
#   Modifiers: bold, dim, italic, underline, blink, reverse, strike
#   Combine: "bold red", "dim cyan", "bold italic green"
#   Hex colors: "#ff5500", "#00ff00" (terminal support varies)
# =============================================================================
theme:
  # Error messages (failures, exceptions)
  error: "bold red"

  # Warning messages (non-critical issues)
  warning: "bold yellow"

  # Success messages (completions, confirmations)
  success: "bold green"

  # Info messages (status updates, notifications)
  info: "bold blue"

  # Muted text (secondary info, timestamps)
  muted: "dim"

  # Highlighted text (emphasis, important values)
  highlight: "bold cyan"

# =============================================================================
# STATUS ICONS
# =============================================================================
# Unicode icons displayed before status messages.
# Change to ASCII alternatives if your terminal doesn't support Unicode.
#
# ASCII alternatives:
#   error: "[X]" or "ERROR:"
#   warning: "[!]" or "WARN:"
#   success: "[OK]" or "DONE:"
#   info: "[i]" or "INFO:"
# =============================================================================
icons:
  error: "✗"
  warning: "⚠"
  success: "✓"
  info: "ℹ"

# =============================================================================
# PROMPT STYLING
# =============================================================================
# Colors for the input prompt (where you type).
# Uses prompt_toolkit style format (similar to Rich).
# =============================================================================
prompt:
  # Main prompt text style (the username)
  style: "bold cyan"

  # Username portion of prompt
  name_style: "bold cyan"

  # Separator between name and input (the ":")
  separator_style: "white"

  # Continuation prompt for multi-line input ("...")
  continuation_style: "gray"

# =============================================================================
# SPINNER SETTINGS
# =============================================================================
# Configure the thinking indicator shown while waiting for LLM responses.
# Messages are randomly selected to add personality to the wait experience.
# =============================================================================
spinner:
  # Spinner animation type (dots, line, dots12, bouncingBar, arc, etc.)
  # See Rich documentation for all available spinner types
  spinner_type: "dots12"

  # Color/style for the message text (e.g., "Thinking...")
  # Examples: "bold magenta", "bright_yellow", "#ff9900", "bold italic green"
  text_style: "bold green"

  # Color/style for the spinner animation symbols (the spinning dots)
  # Examples: "cyan", "yellow", "bright_green"
  spinner_style: "bright white"

  # Randomly select from messages (false = always use first message)
  randomize: true

  # Messages shown while waiting for initial LLM response
  # Add your own for personalization!
  thinking_messages:
    - "Thinking..."
    - "Pondering..."
    - "Consulting..."
    - "Brewing..."
    - "Crunching..."
    - "Baking..."
    - "Spinning..."
    - "Ruminating..."
    - "Assembling..."
    - "Agitating..."
    - "Divining..."
    - "Sifting..."
    - "Dreaming..."
    - "Summoning..."
    - "Defragging..."

  # Messages shown while processing tool results (Re-Act loop)
  tool_messages:
    - "Gluing..."
    - "Tooling..."
    - "Wrenching..."
    - "Hammering..."
    - "Drilling..."
    - "Sawing..."
    - "Ripping..."
    - "Planing..."
