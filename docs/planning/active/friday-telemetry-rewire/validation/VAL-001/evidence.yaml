findings:
- id: VAL-001-F01
  severity: medium
  priority: 1
  criterion: AC-05
  files:
  - packages/friday-telemetry/src/friday_telemetry/providers/composite.py:76-77
  - packages/friday-telemetry/src/friday_telemetry/providers/composite.py:80-84
  authority:
  - docs/planning/active/friday-telemetry-rewire/telemetry-contract.md:58-72
  - docs/planning/active/friday-telemetry-rewire/directives/CD-001-local-telemetry-assembly.md:67-69
  requirement: Pin child ownership at start; removing a provider must not strand its
    open span; end each corresponding child exactly once.
  observed: A different provider can validly reuse the same provider-local ID. On
    replacement of the first provider, unconditional _spans[span_id] assignment overwrites
    the old ownership tuple. end_span closes only the new child, while the removed
    old provider receives no end.
  evidence:
  - test_independent.py:94-110
  - membership-collision.log
  risk: Incorrect span attribution and permanent loss of cleanup for an existing child
    span under supported dynamic membership/custom injection.
  required_mitigation: 'Do not overwrite a live public-ID ownership entry. Preserve
    first-child public-ID compatibility: detect collision, safely close all children
    newly opened by that attempted start and report a content-free aggregate failure,
    leaving prior ownership untouched; or obtain an explicitly approved contract adjustment
    with equivalent safe behavior.'
  required_regression: Two independent conforming providers whose IDs are unique within
    each provider but share a local namespace; replace first provider while a span
    is open, attempt colliding start, verify new children cleaned once, old child
    remains tracked and ends once, no arbitrary exception contents escape. Also retain
    normal parent/membership and failure rollback coverage.
  documentation_config_impact: No new config required. Document the collision/failure
    behavior in telemetry README and reconcile with approved public-ID contract if
    behavior is amended.
