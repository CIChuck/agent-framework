acceptance_criteria:
- 'WS05-AC01: Single public typed provenance DTO, additive sizes/fixed codes, native four-field compatibility,
  consistent status/ingestion validators and declared Transcript dependency.'
- 'WS05-AC02: Original arguments/names execute correctly; all MCP-owned return, continuation/history,
  raw capture, diagnostic and persistence argument copies are empty; no hashes, argument keys, env/header
  or error sentinels survive.'
- 'WS05-AC03: Direct bridge, ToolLoop and both turn modes enforce final UTF-8 byte caps including wrapping/normalization/truncation/failure
  overhead; exact/oversized/multibyte/empty/tiny-cap cases and scan limits above defaults are covered.'
- 'WS05-AC04: Entire retained output is checked under explicit block/drop policy; detected content and
  envelope escape attempts cannot re-enter/capture unchanged; no raw quarantine, detection samples or
  sanitizer repr are persisted/logged.'
- 'WS05-AC05: isError true, malformed flag/content, RPC/transport/timeout and sanitizer rejection yield
  accurate safe failure/blocked provenance; cancellation propagates and public cleanup/retry ownership
  is preserved.'
- 'WS05-AC06: Distinct mixed/multiple/repeated calls retain exact metadata and coherent safe unique IDs;
  missing/invalid/duplicate IDs and concurrent executions do not misassociate results.'
- 'WS05-AC07: Production SQLite adapter and fake adapter receive only safe MCP records; typed call/result
  provenance round-trips with actual entry correlations; old/native records and context-log behavior remain
  compatible.'
- 'WS05-AC08: Full structured JSONL and metadata flag semantics are preserved; Markdown opt-in and existing
  CSV columns implement bounded escaped summaries; native exporters remain compatible.'
- 'WS05-AC09: Native/no-MCP behavior, WS-04 tool selection/result reservation/memory floor and WS-02/03
  lifecycle/registry remain intact; no direct MCP long-term ingestion, telemetry emission or later-phase
  feature is introduced.'
- 'WS05-AC10: Exactly allowed product paths, narrow lock/dependency changes, required checks, real local-peer
  UAT, cleanup, unchanged baselines and preservation/freeze evidence are independently reproducible.'
