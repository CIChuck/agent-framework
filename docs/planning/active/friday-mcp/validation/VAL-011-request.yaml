known_baselines_to_verify:
- Accepted VAL-010 records existing Chat PTY acknowledgement assertion and three localhost HTTP bind PermissionError
  fixture errors. Independently reproduce on approved base with original source imports; distinguish environment
  restrictions from source regressions.
- Integration test_development_board.py still expects 22 tasks while canonical board validates 23. Independently
  verify baseline and unchanged test.
- Default five-package mypy stops on installed NumPy __init__.pyi:737 type-statement syntax under Python
  3.10 target. Independently reproduce baseline; unfiltered Python-3.13 typing on all twelve changed sources
  must pass. Older four profiles.py errors are historical references, not a waiver or present-failure
  assertion.
- Git archive baseline documentation checker may need a read-only Git catalog and existing environment/cache
  flags. Disclose any scratch harness errors distinctly; they cannot excuse candidate failures.
reviewer_instructions:
- Use a newly spawned fresh conversation with fork_turns none. Do not read parent/builder/remediator sessions
  or private reasoning; do not adopt builder conclusions or rely only on candidate tests.
- Read AGENTS.md, every pinned authority document, approved directive and complete approved-base-to-candidate
  aggregate diff. Review all eight tactical tasks and ten criteria. Accepted predecessor reports are frozen
  historical contract evidence, not a new verdict.
- 'Read-only governed workspace: no source/test/report/process edits, staging, commits, board mutations,
  fixes, remediation, cleanup or delivery. Scratch scripts/logs under /private/tmp/VAL-011-independent-20260928
  are allowed.'
- At start and closeout independently verify request/authority/report and candidate hashes, every tracked
  product/config/test byte, aggregate allowed scope and preserved unrelated fingerprints against frozen-inputs.json.
  All governed candidate files remain frozen while review runs.
- Run every required command independently, recording exact env/commands/exits/full outputs and baseline
  reproduction. Never filter errors, add broad ignores, silently skip a mandatory gate or assume builder
  evidence proves a pass.
- Add independent public direct bridge, ToolLoop, actual TurnProcessor streaming/nonstreaming/fallback/raw
  capture and production SQLite/export probes using real synthetic local stdio peers. Exercise original
  name/arguments routing, literal/escaped/normalized/partial argument echoes, request prose/extra fields,
  safe diagnostics/errors/repr, cancellation and public cleanup/retry.
- Probe final complete UTF-8 caps including wrapper/notice/failure growth, exact/oversized/multibyte/empty/tiny
  limits and attack offsets above default normalization/scan caps. Verify explicit high-risk detection/block/drop/log-off
  policy and no raw sanitizer/quarantine payload retention.
- 'Probe isError true, malformed flag/content, RPC/transport/timeout/sanitizer failures and safe accurate
  typed outcomes. Add negative correlation/pair/ID tests: missing/invalid/repeated IDs, mixed/native collisions,
  repeated names, concurrent calls, across iterations, shutdown while memory awaits. Confirm no per-call
  metadata misassociation.'
- Check full typed JSONL and metadata privacy flag, Markdown default/opt-in, bounded CSV summaries with
  unchanged columns, escaped controls/markup, old payload/native serialization and no SQLite schema migration.
  Independently inspect dependency acyclicity/minimal lock delta and meaningful typing.
- 'Mandatory independent package check: use cached offline build tools to build Transcript and declared
  Core/Telemetry dependencies; inspect built Transcript Requires-Dist Core edge and public imports/typed
  round-trip from extracted wheels without editable hooks. Record exact tools, commands, dependencies
  and logs. An unavailable required package/import check blocks completion.'
- Preserve accepted WS-04 selection/result reservation/memory floor and WS-02/03 lifecycle/naming/registry.
  No direct dedicated MCP long-term ingestion, telemetry, hashes/config/server/HTTP/SSE/resources/prompts/live
  refresh or later-phase requirements. Ordinary conversation memory remains unchanged. No universal arbitrary
  secret/injection or input allocation/token-budget claim is authorized.
- Independent fixtures must settle tasks and drain/kill/reap processes in finally even on assertion failure.
  Distinguish public cleanup assertions from defensive fixture teardown; no real credentials, external
  services, paid providers, network UAT or delivery.
- Record reviewer identity/date/model when available, fresh/no inherited context, exact revisions/diff/input
  hashes, complete source-cited criterion evidence, every command/exit/result, documentation/config/migration
