  - Newly spawned independent context with fork_turns none; do not read parent sessions, builder private reasoning or adopt builder conclusions.
  - Read AGENTS.md, policies and all twenty pinned authority documents completely; inspect exact diffs/candidate and all ten criteria.
  - Read-only governed workspace; no source/report/process edits, staging, commits, board changes, remediation, branch cleanup or effects. Return full report to controller.
  - Verify request/candidate/authority revisions and SHA256 values at start and closeout, plus frozen source/tests/config stability.
  - Independently run all required checks and appropriate adversarial local probes, not only the candidate tests.
  - Probe real public registry callable exact routing, full exported cost overhead, sanitizer/unsupported/deep/late-content bypasses, immutable snapshots and diagnostics.
  - Probe mixed native/MCP collision/filter/strict includes, transaction/insert-then-raise/rollback refusal, binding failure after publication, registered-peer failure/cancellation/noisy shutdown and public retained-owner retry.
  - Preserve production cleanup budgets and explicit fixture task/process settlement in finally, including assertion failures. Separate defensive cleanup from asserted public cleanup.
  - Native registry exports remain mutable to trusted in-process callers as explicitly approved; do not invent whole-registry immutability or later-slice output/prompt guarantees.
  - State exact commands/exits/results, mandatory criterion evidence, numbered findings with severity/authority/reproduction/mitigation, docs/config impacts and residual gates.
  - Return exactly one overall outcome VERIFIED, CHANGES_REQUESTED or BLOCKED. VERIFIED is not acceptance; changed candidate/authority needs fresh review.
