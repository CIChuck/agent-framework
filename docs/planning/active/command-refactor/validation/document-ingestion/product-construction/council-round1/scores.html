<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:light dark;font-family:var(--font-sans)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:none;color:var(--foreground)}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted-foreground);margin-bottom:18px}.key{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}.row{display:grid;grid-template-columns:65px 1fr;align-items:center;gap:10px;margin:18px 0}.name{font-size:13px;font-weight:600}.plot{position:relative;display:grid;gap:5px;padding:2px 0}.target{position:absolute;left:95%;top:-6px;bottom:-6px;border-left:2px dashed var(--warning);z-index:2;pointer-events:none}.bar{height:20px;border-radius:3px;text-align:right;padding-right:8px;font-size:12px;line-height:20px;color:var(--primary-foreground);font-weight:650}.coverage{background:var(--chart-1)}.overall{background:var(--chart-2)}.axis{display:flex;justify-content:space-between;margin-left:75px;font-size:11px;color:var(--muted-foreground)}.note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:15px}.flag{color:var(--destructive);font-weight:600}
</style></head><body><div class="legend"><span><i class="key" style="background:var(--chart-1)"></i>Coverage</span><span><i class="key" style="background:var(--chart-2)"></i>Overall</span><span>Dashed line: required 9.5</span></div>
<div class="row"><div class="name">Sol</div><div class="plot" role="img" aria-label="Sol coverage 9.6, overall 9.2 out of 10"><div class="target"></div><div class="bar coverage" style="width:96%">9.6</div><div class="bar overall" style="width:92%">9.2</div></div></div>
<div class="row"><div class="name">Astra</div><div class="plot" role="img" aria-label="Astra coverage 9.6, overall 9.1 out of 10"><div class="target"></div><div class="bar coverage" style="width:96%">9.6</div><div class="bar overall" style="width:91%">9.1</div></div></div>
