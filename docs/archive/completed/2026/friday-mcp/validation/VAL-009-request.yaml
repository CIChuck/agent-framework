acceptance_criteria:
- MCP-03-AC-01 accepted naming/prefix/length and exact original multi-peer routing.
- MCP-03-AC-02 pre-filter MCP/MCP and MCP/native collision preflight with safe diagnostics and no overwrite.
- MCP-03-AC-03 exact read-only typed sidecar, additive compatible DTOs, costs/states and non-double-counted
  discovery/filter/selection/registration diagnostics.
- MCP-03-AC-04 all/selected/category/name/exclusion semantics, zero default selection and fatal explicit
  missing includes even on optional peers.
- MCP-03-AC-05 upstream and full final-export count/byte/aggregate caps, deterministic admission and no
  repeated discovery/backfill.
- MCP-03-AC-06 complete bounded supported-schema validation/sanitation, semantic preservation, attack/shape/depth/node/ref
  rejection/redaction, repr safety and input/adapter mutation resistance.
- MCP-03-AC-07 complete ToolDefinition and legacy API compatibility plus real native-registry callable
  stdio dispatch.
- MCP-03-AC-08 publication before bindings, compatible native/disabled/empty behavior and safe known missing-MCP
  reasons.
- MCP-03-AC-09 transaction/failure/cancellation/repeated-start-stop cleanup, native preservation, retained
  public ownership/retry and all REM-003/004/noisy regression interactions.
- MCP-03-AC-10 exact edit boundary, meaningful typing, no new broad ignores/dependencies/config/later-slice/external
  effects, accurate documentation/residual gates.
