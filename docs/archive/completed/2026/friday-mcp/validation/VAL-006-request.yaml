  and its interactions with accepted WS-00/01.
delta_review:
  - Independently reassess VAL-005 F-001 at both provider-manager and DI-provider ownership layers; do not rely on builder/remediator conclusions.
  - REM-003-AC-01 discovery plus cleanup failure followed by provider retry retains the original manager or fails without replacing it.
  - REM-003-AC-02 public kernel startup failure followed by retry retains the original provider or fails without replacing it.
  - REM-003-AC-03 after cleanup is permitted, public shutdown releases every retained client without callers using saved/private owner references.
  - REM-003-AC-04 successful peer plus cleanup-failing peer demonstrates draining, ownership, safe diagnostics, eventual public cleanup, and no failed-tool registration.
  - REM-003-AC-05 cleanup then recovery succeeds; successful-start/shutdown idempotence, bounded cancellation, optional/required handling, caps, native registry, workspace confinement, and redaction remain correct.
  - REM-003-AC-06 exact five-path bounded correction, compatible public APIs, meaningful typing, no broad suppression, and accurate correction documentation.
  - Check cancellation during retry cleanup and synthetic resource/task teardown, including assertion failure paths.
