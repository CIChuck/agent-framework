    "MCP-AGG-04: Chat per-turn tool selection, schema/result reservation, required-tool decisions and minimum memory retrieval floor operate together on actual registered MCP and native tools.",
    "MCP-AGG-05: Checked MCP output, execution provenance and paired transcript/export records retain safe bounded semantics across direct calls and Chat turns.",
    "MCP-AGG-06: Optional long-term ingestion remains default-disabled; explicit grants, sanitization, durable receipt and retry/pending behavior prevent duplicate or unreceipted publication and preserve native behavior.",
    "MCP-AGG-07: Telemetry and public operational diagnostics are typed, bounded and redacted across lifecycle, collision, call, budget, result and memory outcomes without raw peer/secret leakage.",
    "MCP-AGG-08: Guides, package READMEs and distributed templates match accepted source and disclose limits, deferred WS-09/remote capabilities and real optional/strict-include semantics.",
    "MCP-AGG-09: The exact 75-path product diff and 212 planning/evidence paths are accounted for against initiative baseline; nine accepted work-unit records and historical finding dispositions are coherent; five unrelated dirty paths are preserved.",
