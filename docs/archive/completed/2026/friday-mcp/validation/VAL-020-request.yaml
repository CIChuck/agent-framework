  "acceptance_criteria": [
    "REM010-F001: Newly checked Memory collection manager has explicit optional-ID narrowing, truthful Chroma embedding types and a safe typed graph-listing capability; Memory completion typed/legacy alias resolves inherited errors without behavior drift; exact joint mypy exits zero with no broad suppression.",
