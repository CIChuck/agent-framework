acceptance_criteria:
- 'MCP-04-AC-01: canonical strict config bridge, compatible disabled/native/fake startup and no duplicate
  MCP authority.'
- 'MCP-04-AC-02: real direct Chat public registry discovery/metadata/exact original routing, lifecycle
  owner retained across failed cleanup/retry and app exit; commands coherent without manager internals
  or changed runtime budgets.'
- 'MCP-04-AC-03: per-turn total/MCP counts, aggregate/per-tool costs, defensive schema/metadata validation
  and independent model-bound schema snapshots.'
- 'MCP-04-AC-04: output/system/schema/result reservation calculated before memory retrieval; exact remaining
  limit passed to retrieval, same streaming behavior.'
- 'MCP-04-AC-05: floor preserved through deterministic optional reduction, including empty/native/MCP/mixed
  tools and impossible-base-budget failure.'
- 'MCP-04-AC-06: explicit required/complete manual sets never silently omitted; unavailable/invalid/over-budget
  requirements fail before memory/model calls.'
- 'MCP-04-AC-07: injectable typed estimator with pinned compatible native behavior and conservative MCP
  cost; no broad suppressions/dependency/config drift.'
- 'MCP-04-AC-08: safe typed selection/budget reasons and command diagnostics with no peer secrets/unsafe
  schemas in errors/logs/repr; accurate migration/report and frozen local-only validation with all required
  checks and residual gates.'
