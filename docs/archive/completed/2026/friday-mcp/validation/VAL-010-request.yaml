reviewer_instructions:
- Use a newly spawned fresh context with fork_turns none. Do not read parent/builder/remediator sessions
  or private reasoning; do not adopt builder conclusions or rely solely on candidate tests.
- Read AGENTS.md, all 26 pinned authority documents and the exact complete candidate diff; assess all
  eight criteria. Prior reports/closeouts are frozen accepted contract evidence, not a verdict on new
  WS-04 behavior.
- 'Read-only governed workspace: no source/report/process edits, staging, commits, board changes, remediation,
  cleanup or delivery. Scratch scripts/logs under /private/tmp allowed. Return full independent report
  to controller.'
- Verify candidate/request/authority/report hashes and all tracked product/config bytes at start and closeout.
  Controller will not change candidate source/tests/configuration, pinned authority or implementation
  reports during formal review. Separately excluded process metadata may record dispatch/status.
- Run every required command independently and establish baseline failures at accepted predecessor; record
  exact exits/results rather than silently filtering or waiving failures.
- 'Add independent public Chat construction/start/turn/commands probes with local fake peers: exact original
  routing, native collision preservation, metadata sidecar, idempotency, EOF/start failure/cancellation,
  incomplete-stop retained owner and retry. Do not reach into manager internals to implement or excuse
  consumer behavior.'
- Probe empty/native/MCP/mixed schemas, total/subset/aggregate/per-tool caps, accepted cost overhead/current-export
  mutation, metadata eligibility, annotation/shape attacks and independent prompt copies.
- Probe exact memory formula and retrieval limit, streaming parity, impossible base floor, optional MCP
  reduction before optional native loss, explicit required/manual full sets and no memory/model calls
  on required failure.
- Probe diagnostics for selected/skipped/cost/result/floor/before-after values and safe error/log/repr
  output, estimator injection/native compatibility, disabled/fake/native legacy paths and exact scope/typing/dependency
  boundaries.
- Native registry exports remain mutable for trusted in-process callers; consumer MCP schemas must be
  copied/revalidated. Do not invent exact tokenizer parity, universal injection prevention, actual result
  truncation/sanitation, complete future-history accounting or later-slice output/provenance/storage requirements.
- Maintain accepted production transport cleanup budgets. Independent fixtures/probes must settle tasks
  and kill/drain/reap subprocesses in finally, including assertion failure; distinguish asserted public
  cleanup from defensive teardown.
- Record reviewer identity/date/model availability, fresh/no shared context, exact revisions/hashes/diff,
  complete criterion evidence, every command/exit/result, numbered findings with severity/authority/reproduction/mitigation,
  documentation/config impact and residual gates.
- Return exactly one overall outcome VERIFIED, CHANGES_REQUESTED or BLOCKED; full work_unit_aggregate
  outcome. VERIFIED is not acceptance. Any changed input requires fresh review.
- Write report/evidence only in scratch and provide exact artifact manifest to controller. Use archive-member
  links VAL-010-evidence.tar.gz#member-name for command/probe evidence so the complete byte-exact report
  can be archived without navigation changes. Use valid contiguous Markdown tables and record that model/version
  is unavailable if not exposed.
permitted_validation:
- Deterministic local doubles and bounded local stdio fake peers only; no live MCP/model/provider/network/credentials/costs/delivery.
- Use LITELLM_LOCAL_MODEL_COST_MAP=true, UV_CACHE_DIR=/private/tmp/friday-uv-cache, UV_OFFLINE=true and
  PYTHONDONTWRITEBYTECODE=1 as appropriate; do not inspect secret values. Existing blocked localhost fixtures
  must be reported, not repaired or replaced by external services.
