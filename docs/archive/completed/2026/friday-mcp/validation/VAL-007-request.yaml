delta_review:
  - Independently reassess VAL-006 F-001 against production stdio and public RuntimeKernel shutdown; builder reports are not independent proof.
  - REM-004-AC-01 real SIGTERM-ignoring oversized/unterminated-output child is killed, reaped and drained within the documented finite attempt budget without caller pipe intervention.
  - REM-004-AC-02 successful real discovery then public kernel stop releases all runtime/manager/client/transport resources without cleanup through saved/private references.
  - REM-004-AC-03 required and optional noisy partial-start/handshake/list failure paths clean failed peers and workers, preserve any valid partial success, and never register failed tools.
  - REM-004-AC-04 stdout/stderr discard is incremental and bounded-memory; logs and typed diagnostics exclude raw peer payloads, command/args/env and exception details.
  - REM-004-AC-05 cancellation, already-exited cleanup, repeated disconnect/start/stop, spawn cancellation, EOF, configured RPC deadlines, successful-peer draining and REM-003 recovery remain correct; incomplete cleanup retains owned resources for later public retry.
  - REM-004-AC-06 exact six-path bounded correction, compatible public signatures/schema, meaningful typing, no new broad suppression/private subprocess or cross-package reach-through, accurate evidence.
  - Assess documented phase budget, post-kill wait, owned cleanup/drain tasks and single-reader handoff; do not equate a watchdog abandoning resources with successful cleanup.
  - Independently probe incomplete cleanup and retry/cancellation ownership; inspect assertion-failure fixture teardown separately from public cleanup assertions.
