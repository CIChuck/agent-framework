approval_evidence: >-
  Maintainer said "ws-02 approved", then "continue next steps" following the
  explicit two-file startup-cleanup/stdio-redaction amendment request and defect
  explanation. Approved amendment and WS-02/03 handoff reconciliation are in 5c31f7c.
metadata_note: >-
  This request and subsequent process metadata do not change frozen candidate
  source, tests, configuration, approved directive, build plan, or tactical plan.
  Historical rebaseline and prior verdicts describe predecessor checkpoints.
acceptance_criteria:
  - MCP-02-01 native registration remains compatible and async MCP lifecycle removes unsupported enablement failure.
  - MCP-02-02 manager lifetime is explicitly runtime-owned, inspectable, non-global, and uses only server-specific validated connection inputs.
  - MCP-02-03 discovery and caps finish before binding validation; bounded untrusted state is handed to WS-03 without executable registry insertion.
  - MCP-02-04 public cleanup releases resources after partial startup, failure, cancellation, and success; shutdown is idempotent and cleanup failures preserve ownership.
  - MCP-02-05 optional failures are diagnosed/skipped, required failures abort startup, disabled servers are not connected, and failed tools are never registered.
  - MCP-02-06 connection and discovery deadlines honor effective configured limits including required/optional timeout behavior.
  - MCP-02-07 connection/discovery concurrency and cancellation draining are bounded.
  - MCP-02-08 typed diagnostics distinguish connected/failed/disabled/timeouts/list failures/partial success without raw secrets or peer payloads.
  - Amendment partial handshake/request/receiver/EOF/exited-child/process-spawn cancellation paths release owned resources and raw stdio logs are removed.
  - Public runtime startup signatures and valid programmatic MCP behavior remain compatible; touched modules have meaningful typing and no new broad suppressions.
